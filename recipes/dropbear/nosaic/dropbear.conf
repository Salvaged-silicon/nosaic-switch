Host keys live here and are generated on first use (-R), not shipped in the
image: a key baked into an image is the same key on every switch built from it.

Authorised keys for the login account come from the board's
config/authorized_keys, which is gitignored — it is site identity, not board
data. Without one, password authentication against /etc/shadow is all that is
left, and the account has no password by default.
