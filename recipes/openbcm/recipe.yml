# Broadcom's OpenBCM SDK — the chip support for Trident2+ and the rest of the
# XGS line.
#
# The upstream repository carries ten SDK versions side by side, from 6.5.16 to
# 6.5.27, so the archive is one tree containing all of them and every path here
# names the version it means. 6.5.24 is pinned because it is the one proven on
# this hardware; the newest is not automatically the right one.
#
# Staged, not shipped. This package exists so nosd-td2p can be compiled against
# the SDK's headers and libraries; the switch runs the daemon, not the SDK
# tree. Nothing lists it in a profile.
#
# WHAT IS AND IS NOT USED
#
# The SDK's own BDE is a pair of kernel modules whose newest version guard is
# Linux 4.16, and which use interfaces removed since -- ioremap_nocache went in
# 5.6. This fleet runs 6.12. They are not built, and they are not needed: the
# BDE's job is register access, PCI configuration, a DMA pool and interrupts
# the SDK does not require when nothing is connected, all of which can be done
# from userspace. That is how EOS reaches this chip on the same hardware, with
# no arbitrating driver and ten agents mapping the PCI BAR at once.
#
# So what is built here is the SDK as a library, and NOSaic supplies the small
# piece underneath it. Everything above that piece is unmodified Broadcom code,
# which matters most for chip initialisation: the Trident2 MMU and LLS
# sequences are the part that hand-reproduction repeatedly failed to match.
#
# LICENCE
#
# Broadcom's licence (Legal/LICENSE in the archive) grants the right to
# reproduce and distribute the software and, for source, to create and
# distribute derivative works -- which is what makes an image containing it
# publishable rather than local-only. It also requires that every distributed
# copy reproduce all proprietary notices, so they ship in the image's NOTICE
# and are never stripped.
name: openbcm
version: "6.5.24"
summary: Broadcom OpenBCM SDK (XGS chip support)

license: Broadcom-OpenBCM
redistributable: true

source:
  # Our own deterministic archive of the pinned commit, produced with
  # git archive so it can be reproduced rather than trusted. GitHub's generated
  # archives are not byte-stable, so one is not used as the pinned artifact.
  url: https://github.com/Salvaged-silicon/nosaic-sources/releases/download/sdk-openbcm-6.5.24/openbcm-6d2330ce1b4f.tar.gz
  sha256: 069f2da9ee4af5fd29dbdcc84a1f2c47dc026455d0f33d66c6fe4a2018847fb9
  mirrors:
    - https://github.com/Salvaged-silicon/OpenBCM/archive/6d2330ce1b4fc49d681cffcf09af408661be4c62.tar.gz

patches:
  - patches/0001-build-with-a-modern-toolchain.patch

build:
  # The build runs in systems/linux/user/common, which is where the targets
  # live: the per-platform directories carry only `platform=` and defer here,
  # so building in one gives "No rule to make target user_libs". platform
  # selects x86-64-fc28, whose libraries land in build/unix-user/x86-64-fc28
  # and are what a daemon links against.
  #
  # user_libs rather than a full application: we want libsoc, libbcm and the
  # chip archives, not the SDK's own diagnostic shell.
  system: make
  subdir: sdk-6.5.24/systems/linux/user/common
  targets:
    - platform=x86-64-fc28
    - LINUX_MAKE_USER=1
    - LINUX_MAKE_SHARED_LIB=0
    - SHAREDLIBVER=1
    # Both, in this order, as the working build on this hardware does.
    # user_libs alone builds only systems/bde/linux/user and produces no SDK
    # libraries at all -- it succeeds having compiled nothing, which is worse
    # than failing. bcm is what pulls in libsoc, libbcm and the chip archives.
    - user_libs
    - bcm
  # The SDK links its application into this directory without creating it, and
  # fails with "cannot open output file" if nothing has.
  # Capture the SDK's own compile-time defines.
  #
  # Anything linking against these libraries MUST compile with the same set:
  # the headers are shared, so a define set for the library and not for the
  # consumer silently changes struct layouts and enum values. INCLUDE_RCPU
  # shifts soc_cm_device_vectors_t by a pointer; BCM_ALL_CHIPS decides which
  # chips' memories are in soc_mem_t, so every memory ID differs without it.
  # Neither produces a compile error, a link error, or a log line.
  #
  # So the build records what it used rather than anybody transcribing it.
  # __KERNEL__ and USE_LINUX_BDE_MMAP are dropped: the line this comes from
  # builds the kernel BDE modules, and __KERNEL__ makes sal/core/libc.h pull in
  # linux/ctype.h, which does not exist in a userspace build.
  after:
    - >-
      make platform=x86-64-fc28 -n 2>/dev/null
      | grep -m1 BCM_ALL_CHIPS
      | tr ' ' '\n' | grep '^-D'
      | grep -vE '^-D(__KERNEL__|USE_LINUX_BDE_MMAP|"?KBUILD)'
      | sort -u > sdk-defines.txt
    - "echo \"    captured $(wc -l < sdk-defines.txt) SDK defines\""

  # PowerPC is a different platform definition, not a different flag. The SDK
  # selects a whole target by name and those names share nothing with the
  # architecture id, so no substitution reaches them.
  #
  # bmw-2_6 is Broadcom's own PowerPC big-endian target
  # (make/Makefile.linux-bmw-2_6). It sets
  #
  #   CFGFLAGS += -DSYS_BE_PIO=1 -DSYS_BE_PACKET=0 -DSYS_BE_OTHER=1
  #   ENDIAN = BE_HOST=1
  #
  # which is worth knowing: EdgeNOS carries "BE PIO needs SYS_BE_PIO=1" as a
  # quirk found on the bench, and it is what the vendor's PowerPC platform sets
  # by default. Verified to resolve with our toolchain before being written
  # here -- `make platform=bmw-2_6 -n` emits exactly those four defines.
  arch:
    powerpc:
      targets:
        - platform=bmw-2_6
        - LINUX_MAKE_USER=1
        - LINUX_MAKE_SHARED_LIB=0
        - SHAREDLIBVER=1
        - user_libs
        - bcm
      after:
        - >-
          make platform=bmw-2_6 -n 2>/dev/null
          | grep -m1 BCM_ALL_CHIPS
          | tr ' ' '\n' | grep '^-D'
          | grep -vE '^-D(__KERNEL__|USE_LINUX_BDE_MMAP|"?KBUILD)'
          | sort -u > sdk-defines.txt
        - "echo \"    captured $(wc -l < sdk-defines.txt) SDK defines\""

  mkdirs:
    - sdk-6.5.24/build/linux/user/common

  # The SDK has no install target, so the libraries and headers are copied out
  # of the build tree directly. The archives land in build/unix-user, flat --
  # not under a per-platform directory.
  stage:
    - src: sdk-6.5.24/systems/linux/user/common/sdk-defines.txt
      dst: /usr/lib/openbcm/sdk-defines.txt
    - {src: sdk-6.5.24/build/unix-user, dst: /usr/lib/openbcm}
    - {src: sdk-6.5.24/include, dst: /usr/include/openbcm}

  env:
    # A decade of new diagnostics on code that cannot be revised upstream.
    ADD_TO_CFLAGS: >-
      -Wno-error -Wno-cpp -Wno-address-of-packed-member
      -Wno-stringop-overflow -Wno-stringop-truncation -Wno-array-bounds
