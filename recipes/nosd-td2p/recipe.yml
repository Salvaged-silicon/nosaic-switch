# nosd-td2p — the Trident2+ datapath daemon.
#
# One of several providers of the virtual name `nosd`. The board's ASIC decides
# which provider its image gets, so nothing central maps boards to daemons: it
# falls out of the silicon. `conflicts: [nosd]` is what stops two datapath
# daemons co-installing and fighting over one chip.
#
# STATE: bring-up. This builds the userspace BDE and reports what it maps; it
# does not attach the device or serve the switch-api socket yet.
name: nosd-td2p
version: "0.1.0"
summary: Trident2+ (BCM56860) datapath daemon

license: Apache-2.0
redistributable: true

provides: [nosd]
conflicts: [nosd]

# Built from this repository rather than fetched, so there is no source: stanza.
# The BDE is ours; the SDK it will drive is the openbcm package, staged rather
# than shipped.
# The whole datapath tree, not just this ASIC's directory: datapath/common
# carries the MMIO ordering that differs per host architecture, and a second
# ASIC needs the same header rather than a copy of it. build.subdir selects
# which one is built.
source:
  local: datapath

depends: [glibc]

# The SDK is linked against and never shipped: 874 MB of static archives and
# headers that belong in a build tree and not on a switch. Declared as a build
# dependency so it is staged for the compiler and stays out of the image.
build_depends: [openbcm]

build:
  system: make
  subdir: td2p
  # clean first: the source is this repository, so a local build leaves
  # object files in the tree that get copied in. make then finds them
  # newer than their sources and links the wrong architecture -- caught
  # by the arch check, but only after a full build.
  targets: [clean, nosd-td2p, strip]
  env:
    # Where the staged SDK is. Its headers land under include/openbcm and its
    # archives under lib/openbcm, so this points at the parent of both and the
    # makefile appends. Without it the build still succeeds and produces the
    # BDE and its probe -- which is deliberate: a contributor without a 1.8 GB
    # vendor tree can still build, test and change everything else here.
    SDK_DIR: "${STAGING}/usr"
  # No install target in the makefile: it is three files, and stating where
  # the binary lands here keeps that decision in the recipe where a reader
  # looks for it.
  # Relative to the source root, which is the whole datapath tree -- so the
  # binary is under the subdir the build ran in.
  stage:
    - src: td2p/nosd-td2p
      dst: /usr/sbin/nosd-td2p

  # The virtual name everything above the datapath uses. A symlink rather than
  # a second copy: the binary carries the SDK and is 151 MB.
  links:
    - target: nosd-td2p
      path: /usr/sbin/nosd
