! NOSaic default FRR configuration.
!
! Deliberately inert: it sets up logging and nothing else. Interfaces and
! routing protocols are configured per box, and shipping a default that
! adjacency-forms with whatever is on the wire would be a surprise rather
! than a convenience.
frr defaults traditional
log file /var/log/frr.log informational
service integrated-vtysh-config
!
line vty
!
