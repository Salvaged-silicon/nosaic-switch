! FRR configuration for a NOSaic switch.
!
! Integrated config: every daemon reads this one file, which is why zebra and
! ospfd are both started with -f /etc/frr/frr.conf.
frr defaults traditional
log file /var/log/frr.log informational
service integrated-vtysh-config

! ── OSPFv2 ──────────────────────────────────────────────────────────────────
!
! The router-id is the LOOPBACK address, not an interface address. An id taken
! from a front-panel interface changes meaning when that port goes down, and a
! router-id that depends on a link is a router-id that moves during exactly the
! event you need it to be stable through.
!
! MTU matters more here than it looks. Every routed port on this board runs at
! 1600 because its neighbours do, and OSPF refuses to leave ExStart when the two
! ends disagree -- an adjacency that reaches ExStart and stops is the signature,
! not a broken link. The far ends were brought to 1600 to match rather than this
! side being lowered to 1500.
# ⚠ NO ROUTING IS CONFIGURED HERE, AND THAT IS DELIBERATE.
#
# This file ships in EVERY image built from this tree, for every board, so
# anything in it is claimed by every switch that boots one. It used to carry a
# router-id and four network statements belonging to one lab switch, which made
# any second switch built from this source a duplicate of it in OSPF -- same
# router-id in the same area.
#
# A switch's own routing goes in
#
#     /mnt/data/config/frr.conf
#
# which the frr-siteconf service copies over this at boot. That path is on the
# data partition, so it survives an upgrade, a rollback and a reinstall. A board
# model may also ship platform/<board>/config/frr.conf for defaults that are
# genuinely true of every unit of that model -- an address is not one of those.
#
# max-metric is kept: an unconfigured router that does come up should not
# volunteer itself as a transit path.
router ospf
 max-metric router-lsa
exit
!
line vty
