# nosd-tdp — the Trident+ datapath, for the BCM56840 family.
#
# The AS5610-52X's BCM56846 is a member of that family and shares its register
# database (src/soc/mcm/bcm56840_a0.c in the SDK), which is why grepping the
# SDK for the exact part number finds almost nothing and looks discouraging.
#
# This now claims `nosd`, on the condition the earlier note set for it: there is
# something here that drives a datapath. tdp-probe --serve attaches the chip,
# runs soc and bcm init, enables every port, puts them in forwarding and then
# stays resident so the SDK's link scan and counter threads keep running. On the
# AS5610-52X that is a switch which floods between front-panel ports in
# hardware, measured rather than assumed.
#
# It is still one binary doing two jobs -- the probe modes remain, because
# bring-up on the next board of this family will want them -- and it implements
# none of switch-api yet. What it provides is the daemon the unit file names,
# not the northbound contract, and the gap between those is the work left.
name: nosd-tdp
version: "0.1.0"
summary: Trident+ (BCM56840 family) datapath — BDE and bring-up probe

license: Apache-2.0
redistributable: true

# The whole datapath tree, because datapath/common carries the MMIO ordering
# this shares with nosd-td2p. build.subdir selects which ASIC is built.
source:
  local: datapath

depends: [glibc]

# Exclusive: two datapath daemons on one chip would fight over it.
provides: [nosd]
conflicts: [nosd]

# Staged to build against, never shipped: the SDK is 874 MB of static archives
# and what leaves here is the binary that linked them.
build_depends: [openbcm]

build:
  system: make
  subdir: tdp
  env:
    # Where the staged SDK is. Without it the makefile builds only the BDE and
    # its probe, which is deliberate -- a contributor without the vendor tree
    # can still build, test and change everything else here.
    SDK_DIR: "${STAGING}/usr"
  # clean first: the source is this repository, so a local build leaves
  # object files in the tree that get copied in. make then finds them
  # newer than their sources and links the wrong architecture -- caught
  # by the arch check, but only after a full build.
  targets: [clean, tdp-probe, strip]

  # Relative to the source root, which is the whole datapath tree.
  stage:
    - src: tdp/tdp-probe
      dst: /usr/sbin/tdp-probe
      mode: "0755"

  # The name everything above this layer uses. The unit, the CLI and the docs
  # say `nosd`; which silicon is behind it is the image builder's business.
  # A link rather than a second copy, because the binary is 125 MB.
  links:
    - target: /usr/sbin/tdp-probe
      path: /usr/sbin/nosd

services:
  - name: nosd
    exec: /usr/sbin/nosd --serve
    after: [network]
    restart: always
