# The minimal profile — the smallest bootable NOSaic.
#
# For boards where systemd does not fit: small flash, modest RAM, the older end
# of end-of-service-life hardware. It is not a cut-down version of the full
# profile so much as the same packages with a different init and a smaller set.
#
# PID 1 is s6-svscan. The whole supervision suite is a few hundred kilobytes,
# which is the point: this tier exists for boards where systemd does not fit.
name: minimal
init: s6

# doas rather than sudo, because this tier is for boards where systemd does not
# fit and sudo is a megabyte of setuid C with a configuration language. The
# job is the same and the account is the same; only the binary differs.
privilege: doas

# Everything the image contains. Dependencies are resolved from here, so this
# lists what the profile is *for*, not the transitive closure.
packages:
  - linux
  - glibc
  - busybox
  - s6-rc
  - opendoas

# Two slots plus a shared data partition. The smallest boards may not have room
# for two, and there the upgrade path degrades to non-atomic and says so.
slots: 2

description: >
  A bootable system with a shell, a console login and nothing else. Enough to
  bring a board up, prove the datapath, and be recovered over serial.
