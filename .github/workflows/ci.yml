name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast gate, on every commit. A clone plus Docker and make must be enough,
  # which is why there is no Go setup step here: if CI needed one, the claim
  # in the README would be false.
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned builder container
        run: make builder
      - name: Check
        run: make check
      - name: Build the CLI
        run: make nosaic
      - name: Smoke-test the CLI
        run: |
          ./out/nosaic version
          ./out/nosaic boards

  # The M2 gate: a package builds from source, and building it twice produces
  # identical bytes.
  #
  # This needs a cross-toolchain, which takes about 45 minutes to build, so it
  # is cached on the defconfig and the crosstool-NG version -- the only inputs
  # that can change what the toolchain is. A cache hit makes this job minutes
  # rather than an hour; a miss rebuilds honestly rather than skipping the gate.
  package:
    name: build a package, reproducibly
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      # Sources are pinned by hash, so caching them is safe: a cache cannot
      # substitute different content. It also stops a transient network failure
      # from failing a run that has nothing to do with the network -- which is
      # what happened twice before this was added.
      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('recipes/**/recipe.yml', 'bootstrap/versions.env') }}
          restore-keys: dl-

      - name: Cache the x86_64 toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-x86_64-${{ hashFiles('bootstrap/configs/x86_64.defconfig', 'bootstrap/versions.env') }}

      - name: Build the pinned builder container
        run: make builder

      - name: Build the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: make toolchain ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g

      - name: Prove the toolchain produces runnable binaries
        run: make toolchain-test ARCH=x86_64

      - name: Build zlib from source
        run: make pkg PKG=zlib ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g

      - name: Verify every digest in the package
        run: |
          make nosaic
          ./out/nosaic pkg verify out/packages/zlib_1.3.1_x86_64.nos

      # Everything the minimal profile needs, in dependency order computed from
      # the recipes rather than from a list here that would drift. Narrowed to
      # the profile so an unfinished package elsewhere in recipes/ cannot block
      # a profile that does not use it.
      - name: Build the minimal profile's packages
        run: make packages ARCH=x86_64 PROFILE=minimal JOBS=4 CPUS=4 MEMORY=8g

      # The kernel is cached on the inputs that determine it, because building
      # one on every commit would make CI useless without proving anything new.
      - name: Cache the kernel package
        id: kernel
        uses: actions/cache@v4
        with:
          path: out/packages
          key: pkgs-x86_64-${{ hashFiles('recipes/**', 'arch/x86_64/arch.yml') }}

      - name: Build the kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: make pkg PKG=linux ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g

      # Not "does it compile": boot it, run an init built by our own toolchain,
      # and have that init confirm from inside the running kernel that the
      # filesystems the image design depends on are actually present.
      - name: Boot the kernel and run its own userspace
        run: make kernel-boot ARCH=x86_64

      # The datapath needs Broadcom's BDE and KNET modules, which are built out
      # of tree against the kernel we ship. Proving a module compiles is the
      # only way to know the packaged build tree is usable: it can contain the
      # right paths and still be missing Module.symvers, or carry a pristine
      # scripts/ rather than the built one, and both produce a package that
      # looks correct and cannot build anything.
      #
      # vermagic is checked because a module built against the wrong headers
      # does not fail to build -- it loads and then misbehaves.
      - name: Build a module out of tree against the packaged kernel headers
        run: |
          make pkg PKG=linux-headers ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g
          rm -rf /tmp/hdr && mkdir -p /tmp/hdr
          tar xOf out/packages/linux-headers_6.12.105_x86_64.nos data.tar.gz \
            | tar xz -C /tmp/hdr
          KDIR=/tmp/hdr/usr/lib/modules/6.12.105/build
          cp -r internal/pkgbuild/testdata/oot-module /tmp/oot
          docker run --rm -v "$PWD":/src -v /tmp:/tmp -w /tmp/oot \
            -e PATH=/src/toolchain/x86_64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            nosaic/builder:0.1 \
            make -C "$KDIR" M=/tmp/oot ARCH=x86 CROSS_COMPILE=x86_64-nosaic-linux-gnu- modules
          test -f /tmp/oot/hello.ko || { echo "::error::no module was produced"; exit 1; }
          vm=$(strings -a /tmp/oot/hello.ko | grep '^vermagic=' || true)
          echo "$vm"
          case "$vm" in
            vermagic=6.12.105*) echo "matches the shipped kernel" ;;
            *) echo "::error::vermagic does not match the shipped kernel: $vm"; exit 1 ;;
          esac

      - name: Compose the image
        run: make image BOARD=virt-x86_64

      # The real gate. Not "does it compile" and not "does it start": the image
      # is attached as a disk and mounted by the initramfs exactly as it would
      # be on hardware, brings up an s6 supervision tree from service
      # definitions svcgen generated, reaches a login prompt, and self-tests
      # from inside the running system before powering off.
      - name: Boot it
        run: make image-boot BOARD=virt-x86_64

      # Both directions. A happy-path-only test is passed perfectly by an
      # implementation that always commits, and that implementation has no
      # safety net at all.
      - name: Prove the A/B upgrade commits and rolls back
        run: make image-ab BOARD=virt-x86_64

      # Every profile, booted -- not merely built.
      #
      # The design leans on the abstract services: stanza to keep two init
      # backends viable, and the only thing that actually holds it is building
      # both. A recipe reaching for something systemd-specific breaks the s6
      # tier, and a change to the shared image layout breaks whichever tier
      # nobody ran: the /usr merge that made the systemd tiers work rewrote the
      # layout for all three, and only booting minimal again showed it had not
      # broken it.
      #
      # Booted rather than built because a build proves very little here. Every
      # failure in these tiers so far -- extraction writing through a symlink,
      # a split /usr, an init symlink that resolved to nothing -- produced a
      # clean build and an image that panicked.
      - name: Build and boot the systemd tiers
        run: |
          for profile in slim full; do
            echo "::group::$profile"
            make packages ARCH=x86_64 PROFILE=$profile JOBS=4 CPUS=4 MEMORY=8g
            make image BOARD=virt-x86_64 PROFILE=$profile
            make image-boot BOARD=virt-x86_64
            echo "::endgroup::"
          done

      # Leave the minimal image in place: the steps after this one expect it.
      - name: Restore the minimal image
        run: make image BOARD=virt-x86_64

      # Run on the runner with sudo rather than granting the build container
      # NET_ADMIN and SYS_ADMIN.
      #
      # The test needs a private network namespace because it creates real
      # interfaces. Doing that by widening the container's capabilities would
      # put a near-root grant in this file as a precedent for every later job;
      # the runner already offers passwordless sudo and is ephemeral, so the
      # isolation is the same and nothing new is normalised. The binaries are
      # still built in the container, so the toolchain stays pinned.
      - name: Build iproute2 and the binaries the datapath test needs
        run: |
          make pkg PKG=iproute2 ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g
          make nosaic
          docker run --rm -v "$PWD":/src -w /src nosaic/builder:0.1 \
            go build -buildvcs=false -o out/nosd ./cmd/nosd

      - name: Drive a real veth datapath through the contract
        run: sudo -E env "PATH=$PATH" bash boot/virt/dataplane-test.sh

      - name: Rebuild and require identical bytes
        run: |
          before=$(sha256sum out/packages/zlib_1.3.1_x86_64.nos | cut -d' ' -f1)
          make pkg PKG=zlib ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g
          after=$(sha256sum out/packages/zlib_1.3.1_x86_64.nos | cut -d' ' -f1)
          echo "first:  $before"
          echo "second: $after"
          if [ "$before" != "$after" ]; then
            echo "::error::the package is not reproducible"
            exit 1
          fi
          echo "reproducible"

  # The arch canary. Cross-built on every commit, never booted, and no board
  # needs it yet.
  #
  # Its whole job is to fail the moment something x86-specific is assumed,
  # during the months when all real work is x86. Without it the arch seam is
  # only a claim: the design says the axes are orthogonal, and nothing would
  # test that until PowerPC lands at M8 with a year of assumptions to unpick.
  #
  # It builds the packages rather than only the toolchain, because a toolchain
  # that produces working binaries proves very little about recipes -- the ways
  # a cross-build goes wrong are in configure scripts finding the host's
  # headers, not in the compiler.
  canary:
    name: cross-build for aarch64
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched sources
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('recipes/**/recipe.yml', 'bootstrap/versions.env') }}
          restore-keys: dl-

      - name: Cache the aarch64 toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-aarch64-${{ hashFiles('bootstrap/configs/aarch64.defconfig', 'bootstrap/versions.env') }}

      - name: Build the pinned builder container
        run: make builder

      - name: Build the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: make toolchain ARCH=aarch64 JOBS=4 CPUS=4 MEMORY=8g

      # Under user-mode emulation. Enough to prove the toolchain emits working
      # code for a machine nobody here has.
      - name: Prove it produces binaries that run
        run: make toolchain-test ARCH=aarch64

      # The actual canary. Every recipe in the profile, cross-compiled.
      - name: Cross-build the minimal profile
        run: make packages ARCH=aarch64 PROFILE=minimal JOBS=4 CPUS=4 MEMORY=8g
