name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast gate, on every commit. A clone plus Docker and make must be enough,
  # which is why there is no Go setup step here: if CI needed one, the claim
  # in the README would be false.
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned builder container
        run: make builder
      - name: Check
        run: make check
      - name: Build the CLI
        run: make nosaic
      - name: Smoke-test the CLI
        run: |
          ./out/nosaic version
          ./out/nosaic boards

  # The M2 gate: a package builds from source, and building it twice produces
  # identical bytes.
  #
  # This needs a cross-toolchain, which takes about 45 minutes to build, so it
  # is cached on the defconfig and the crosstool-NG version -- the only inputs
  # that can change what the toolchain is. A cache hit makes this job minutes
  # rather than an hour; a miss rebuilds honestly rather than skipping the gate.
  package:
    name: build a package, reproducibly
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Cache the x86_64 toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-x86_64-${{ hashFiles('bootstrap/configs/x86_64.defconfig', 'bootstrap/versions.env') }}

      - name: Build the pinned builder container
        run: make builder

      - name: Build the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: make toolchain ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g

      - name: Prove the toolchain produces runnable binaries
        run: make toolchain-test ARCH=x86_64

      - name: Build zlib from source
        run: make pkg PKG=zlib ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g

      - name: Verify every digest in the package
        run: |
          make nosaic
          ./out/nosaic pkg verify out/packages/zlib_1.3.1_x86_64.nos

      # The kernel is cached on the inputs that determine it, because building
      # one on every commit would make CI useless without proving anything new.
      - name: Cache the kernel package
        id: kernel
        uses: actions/cache@v4
        with:
          path: out/packages
          key: pkgs-x86_64-${{ hashFiles('recipes/**', 'arch/x86_64/arch.yml') }}

      - name: Build the kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: make pkg PKG=linux ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g

      # Not "does it compile": boot it, run an init built by our own toolchain,
      # and have that init confirm from inside the running kernel that the
      # filesystems the image design depends on are actually present.
      - name: Boot the kernel and run its own userspace
        run: make kernel-boot ARCH=x86_64

      - name: Build busybox
        run: make pkg PKG=busybox ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g

      - name: Compose the image
        run: make image BOARD=virt-x86_64

      # The real gate. Not "does it compile" and not "does it start": the image
      # is attached as a disk and mounted by the initramfs exactly as it would
      # be on hardware, reaches a login prompt, and self-tests from inside the
      # running system before powering off.
      - name: Boot it
        run: make image-boot BOARD=virt-x86_64

      # Both directions. A happy-path-only test is passed perfectly by an
      # implementation that always commits, and that implementation has no
      # safety net at all.
      - name: Prove the A/B upgrade commits and rolls back
        run: make image-ab BOARD=virt-x86_64

      - name: Rebuild and require identical bytes
        run: |
          before=$(sha256sum out/packages/zlib_1.3.1_x86_64.nos | cut -d' ' -f1)
          make pkg PKG=zlib ARCH=x86_64 JOBS=4 CPUS=4 MEMORY=8g
          after=$(sha256sum out/packages/zlib_1.3.1_x86_64.nos | cut -d' ' -f1)
          echo "first:  $before"
          echo "second: $after"
          if [ "$before" != "$after" ]; then
            echo "::error::the package is not reproducible"
            exit 1
          fi
          echo "reproducible"
