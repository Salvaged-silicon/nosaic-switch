# NOSaic CPU architecture: x86-64.
#
# The first architecture, and the one that goes all the way to real hardware
# before anything is cross-compiled. It is still built through crosstool-NG
# rather than with the host compiler: taking the same path as every other
# architecture is what stops host assumptions leaking in and only being found
# when the first genuine cross-build is attempted.
id: x86_64
name: x86-64
triple: x86_64-nosaic-linux-gnu
endian: little
bits: 64
# GOARCH for NOSaic's own Go binaries, stated rather than derived: the
# names agree with the id here by luck, not by rule.
go_arch: amd64

kernel_arch: x86
ctng_sample: x86_64-unknown-linux-gnu

# Empty: binaries run natively on the build host.
qemu: ""

# Ceiling on the glibc minimum-kernel ABI floor. Generous enough for any
# architecture's own glibc default, strict enough to catch a toolchain that
# silently pinned itself to the kernel-headers version instead.
abi_kernel_max: "4.0.0"

qemu_system: qemu-system-x86_64
qemu_console: ttyS0
qemu_machine: ""

qemu_cpu: ""

kernel_defconfig: x86_64_defconfig
kernel_image: arch/x86/boot/bzImage
elf_machine: "EM_X86_64"

status: supported
notes: >
  Modern whitebox and brite-box switches are overwhelmingly x86-64, including
  the Arista 7050 family. This is where NOSaic reaches hardware first.
