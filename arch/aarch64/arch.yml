# NOSaic CPU architecture: AArch64.
#
# The CI canary. It is cross-built on every commit and never booted, and no
# board needs it yet. Its whole job is to fail loudly the moment something
# x86-specific is assumed, during the months when all real work is x86 — the
# alternative is discovering it at M8 with a year of assumptions to unpick.
id: aarch64
name: AArch64
triple: aarch64-nosaic-linux-gnu
endian: little
bits: 64
# GOARCH for NOSaic's own Go binaries, stated rather than derived: the
# names agree with the id here by luck, not by rule.
go_arch: arm64

kernel_arch: arm64
ctng_sample: aarch64-unknown-linux-gnu

# Binaries are exercised under user-mode emulation. Enough to prove the
# toolchain produces working code; not a substitute for booting.
qemu: qemu-aarch64-static

# Ceiling on the glibc minimum-kernel ABI floor. Generous enough for any
# architecture's own glibc default, strict enough to catch a toolchain that
# silently pinned itself to the kernel-headers version instead.
abi_kernel_max: "4.0.0"

qemu_system: qemu-system-aarch64
qemu_console: ttyAMA0
qemu_machine: "virt,gic-version=3"
qemu_cpu: cortex-a57

kernel_defconfig: defconfig
kernel_image: arch/arm64/boot/Image
elf_machine: "EM_AARCH64"

status: canary
notes: >
  Newer whitebox designs are moving to arm64, so this is a real target in
  waiting rather than a purely synthetic one.
