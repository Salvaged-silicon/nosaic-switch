# NOSaic CPU architecture: 32-bit big-endian PowerPC (Freescale e500v2).
#
# The AS5610-52X's P2020. Status is 'planned' until spike S1 proves a modern
# toolchain can produce binaries that actually run on the hardware.
#
# Why the nofpu sample, and not the obvious ones:
#
#   powerpc-e500v2-linux-gnuspe   the native e500v2 ABI, but crosstool-NG pins
#                                 it to gcc-8.5.0 + glibc-2.29, because GCC 8
#                                 is the last release that has the SPE ABI at
#                                 all. Choosing it freezes this architecture on
#                                 a 2021 compiler forever.
#   powerpc-unknown-linux-gnu     generic PowerPC, gcc-15 -- but with a classic
#                                 FPU. e500v2 has no classic FPU, so binaries
#                                 built this way die with SIGILL on the real
#                                 board. It is the trap, not the answer.
#   powerpc-8540-linux-gnu        e500v1, and pinned to glibc-2.23 with 3.4
#                                 kernel headers.
#
# So: soft-float generic PowerPC on a current gcc-15.2.0 / glibc-2.42. e500v2
# executes standard PowerPC integer instructions natively; software floating
# point costs nothing measurable in a datapath that barely uses it.
id: powerpc
name: PowerPC 32-bit big-endian (e500v2, soft-float)
triple: powerpc-nosaic-linux-gnu
endian: big
bits: 32
kernel_arch: powerpc
ctng_sample: powerpc-unknown_nofpu-linux-gnu

qemu: qemu-ppc-static

# Instruction classes an e500v2 cannot execute. Audited on every toolchain test,
# because a hard-float build disassembles cleanly, runs under QEMU's permissive
# generic-PowerPC model, and only fails on the real board.
forbidden_insn_re: "^(lfs|lfd|lfsu|lfdu|lfsx|lfdx|stfs|stfd|stfsu|stfdu|stfsx|stfdx|fadd|fadds|fsub|fsubs|fmul|fmuls|fdiv|fdivs|fmadd|fmadds|fmsub|fmsubs|fnmadd|fnmsub|fneg|fabs|fmr|frsp|fctiw|fctiwz|fcmpu|fcmpo|mffs|mtfsf|fsqrt|fsqrts|fsel|fres|frsqrte|lvx|stvx|vadd[a-z0-9]*|vsub[a-z0-9]*|vperm)$"

# Ceiling on the glibc minimum-kernel ABI floor. Generous enough for any
# architecture's own glibc default, strict enough to catch a toolchain that
# silently pinned itself to the kernel-headers version instead.
abi_kernel_max: "4.0.0"

status: canary
notes: >
  Spike S1, answered 2026-08-27: yes. gcc-15.2.0 / glibc-2.42 / binutils-2.45
  built in 47 minutes and produced a static big-endian 32-bit binary that ran
  and reported bits=32 endian=big. An instruction audit of the whole binary --
  112,775 instructions, all of glibc included -- found no classic-FPU, no SPE
  and no AltiVec instructions at all, only base integer PowerPC. So the SIGILL
  risk is structurally absent rather than merely untested.
  Outstanding: confirmation on a real AS5610. QEMU emulates a permissive
  generic PowerPC, so it cannot settle CPU-model questions on its own -- the
  instruction audit is what carries that argument, not the emulator.
