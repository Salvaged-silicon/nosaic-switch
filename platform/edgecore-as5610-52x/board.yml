# Edgecore AS5610-52X -- Freescale P2020 (e500v2, big-endian) + BCM56846
# (Trident+). 48 x SFP+ 10G plus 4 x QSFP+ 40G.

id: edgecore-as5610-52x
vendor: edgecore
model: as5610-52x

arch: powerpc
asic: tdp
boot: onie-sfx

# This board runs U-Boot underneath ONIE, so it states U-Boot addresses even
# though its installer is ONIE. That is what lets the build emit a FIT the
# board can load over TFTP into RAM -- see docs/install.md.
#
# Zero for both is not a placeholder: the PowerPC boot wrapper is a
# self-relocating zImage, so U-Boot decompresses it to the bottom of RAM and
# enters it there. The addresses are read back out of the kernel's own uImage
# header, and they match what the vendor's own boot command uses.
u_boot_arch: ppc
u_boot_load: "0x00000000"
u_boot_entry: "0x00000000"

# Where a TFTP'd image is parked before bootm unpacks it, and where the two
# blobs inside it are placed. The fdt and ramdisk addresses are read off the
# FIT this switch actually boots today, not chosen: U-Boot 2013.01 here is
# known to want telling.
#
# The vendor stages at 0x02000000, which is right for its own 5 MB image and
# wrong for ours. A RAM-booted image carries the whole root filesystem, so the
# initramfs unpacks from 0x03100000 upward -- staging on top of that has the
# copy overwrite its own source partway through.
#
# 0x10000000 (256 MB) rather than something tighter, because the initramfs grew
# when the RAM boot stopped carrying a squashfs and started carrying the tree:
# 42 MB became 78 MB, which put its top within a megabyte of a stage address of
# 0x08000000. That margin is not worth defending. This board has 2 GB and the
# only cost of staging higher is address space nothing else wants.
u_boot_stage: "0x10000000"
# U-Boot 2013.01 here knows crc32, md5 and sha1. A FIT hashed with sha256
# transfers, reports the configuration it found, and then fails with
# "ERROR: can't get kernel image!" -- which reads like a corrupt image rather
# than an unsupported digest. Read off the FIT this switch boots today.
u_boot_fit_hash: "crc32"

u_boot_fdt_addr: "0x03000000"
u_boot_ramdisk_addr: "0x03100000"

# A P2020 has no ACPI, so nothing tells the kernel what is on the board except
# this file. Compiled at image time and carried inside the FIT.
device_tree: dts/as5610-52x.dts

# No platform HAL on this board yet, so the optics are brought up by a script
# rather than by `nosaic platform tx`. Without it every port links down: the
# cages power up with TX_DISABLE asserted and the retimers unprogrammed.
front_panel_init: scripts/sfp-init.sh

# The fans, for the same reason. Without this the board runs at the duty it
# powered up at -- 31 of 31, permanently -- which is safe and about three times
# what it needs.
cooling: scripts/cooling.sh

# How long the network service waits for interfaces named in network.conf.
# The swp ports come from the datapath daemon, and there is no nosd-tdp yet, so
# they cannot appear at all -- the default 600 would be ten minutes of waiting
# for something impossible, and the service transition it belongs to gives up
# first. Raise this to the default once the datapath exists.
net_wait_secs: 60

profile: minimal
kernel: ""

status: bringup

notes: >
  Big-endian PowerPC, which is the first board in the fleet that is not
  little-endian x86 -- the SDK needs SYS_BE_PIO=1 and any structure shared
  with the chip needs checking rather than assuming.

  The ASIC is a BCM56846 Trident+ with a CMICe, not the CMICm the Trident2+
  boards have; the interrupt and DMA paths differ and the 7050SX2's BDE does
  not carry over unchanged.

  ONIE and the NOS share one disk, reached over USB, and the vendor's boot
  command loads the NOS from MBR partition 5. Installing by writing a whole
  disk image would take ONIE with it and remove the way back, so the ONIE
  backend must install into a partition. Until it does, use the TFTP netboot
  path, which writes nothing.

# No platform_hal stanza, and it is not an oversight.
#
# The HAL and everything that drives it live in the nosaic CLI, which is Go, and
# the Go toolchain has ppc64 and ppc64le and has never had 32-bit big-endian
# PowerPC. No Go binary runs on this board, so a HAL driver for it could be
# written and could never be executed. Declaring one would also switch off the
# front_panel_init fallback below, which does work.
#
# The board controller is still reachable -- it is a handful of byte registers
# on the local bus at 0xea000000 -- so what would have been a HAL driver is a
# shell script instead. See scripts/cooling.sh.

console: ttyS0
console_baud: 115200
