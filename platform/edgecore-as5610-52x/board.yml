# Edgecore AS5610-52X -- Freescale P2020 (e500v2, big-endian) + BCM56846
# (Trident+). 48 x SFP+ 10G plus 4 x QSFP+ 40G.

id: edgecore-as5610-52x
vendor: edgecore
model: as5610-52x

arch: powerpc
asic: tdp
boot: onie-sfx

# This board runs U-Boot underneath ONIE, so it states U-Boot addresses even
# though its installer is ONIE. That is what lets the build emit a FIT the
# board can load over TFTP into RAM -- see docs/install.md.
#
# Zero for both is not a placeholder: the PowerPC boot wrapper is a
# self-relocating zImage, so U-Boot decompresses it to the bottom of RAM and
# enters it there. The addresses are read back out of the kernel's own uImage
# header, and they match what the vendor's own boot command uses.
u_boot_arch: ppc
u_boot_load: "0x00000000"
u_boot_entry: "0x00000000"

# Where a TFTP'd image is parked before bootm unpacks it, and where the two
# blobs inside it are placed. The fdt and ramdisk addresses are read off the
# FIT this switch actually boots today, not chosen: U-Boot 2013.01 here is
# known to want telling.
#
# The vendor stages at 0x02000000, which is right for its own 5 MB image and
# wrong for ours. A RAM-booted image carries the whole root filesystem, so the
# initramfs unpacks from 0x03100000 upward -- staging on top of that has the
# copy overwrite its own source partway through.
#
# 0x10000000 (256 MB) rather than something tighter, because the initramfs grew
# when the RAM boot stopped carrying a squashfs and started carrying the tree:
# 42 MB became 78 MB, which put its top within a megabyte of a stage address of
# 0x08000000. That margin is not worth defending. This board has 2 GB and the
# only cost of staging higher is address space nothing else wants.
u_boot_stage: "0x10000000"
# U-Boot 2013.01 here knows crc32, md5 and sha1. A FIT hashed with sha256
# transfers, reports the configuration it found, and then fails with
# "ERROR: can't get kernel image!" -- which reads like a corrupt image rather
# than an unsupported digest. Read off the FIT this switch boots today.
u_boot_fit_hash: "crc32"

u_boot_fdt_addr: "0x03000000"
u_boot_ramdisk_addr: "0x03100000"

# A P2020 has no ACPI, so nothing tells the kernel what is on the board except
# this file. Compiled at image time and carried inside the FIT.
device_tree: dts/as5610-52x.dts

# No platform HAL on this board yet, so the optics are brought up by a script
# rather than by `nosaic platform tx`. Without it every port links down: the
# cages power up with TX_DISABLE asserted and the retimers unprogrammed.
front_panel_init: scripts/sfp-init.sh

# How long the network service waits for interfaces named in network.conf.
# The swp ports come from the datapath daemon, and there is no nosd-tdp yet, so
# they cannot appear at all -- the default 600 would be ten minutes of waiting
# for something impossible, and the service transition it belongs to gives up
# first. Raise this to the default once the datapath exists.
net_wait_secs: 60

profile: minimal
kernel: ""

# Cleared bringup on 2026-09-04: installed on its own disk, and back from a cold
# power cut at the PDU in about ninety seconds with the ext4 journal replaying
# clean, 10 of 10 ports up, 52 routes and ten OSPF adjacencies -- the same state
# it went down in. An A/B upgrade also ran here and the switch committed it
# itself.
#
# experimental rather than production, and nothing in this project is called
# production until it has run somewhere that matters for longer than a lab
# afternoon. Still open here: ECMP, and the datapath cannot be restarted without
# taking the front panel down with it.
status: experimental

notes: >
  Big-endian PowerPC, which is the first board in the fleet that is not
  little-endian x86 -- the SDK needs SYS_BE_PIO=1 and any structure shared
  with the chip needs checking rather than assuming.

  The ASIC is a BCM56846 Trident+ with a CMICe, not the CMICm the Trident2+
  boards have; the interrupt and DMA paths differ and the 7050SX2's BDE does
  not carry over unchanged.

  ONIE and the NOS share one disk, reached over USB, and the vendor's boot
  command loads the NOS from MBR partition 5. Installing by writing a whole
  disk image would take ONIE with it and remove the way back, so the ONIE
  backend must install into a partition. Until it does, use the TFTP netboot
  path, which writes nothing.

# The board controller: a CPLD on the P2020's local bus at chip select 1, which
# the device tree maps to 0xea000000. It carries the fan duty, power supply
# status and the two chassis LEDs, and no PCI addresses -- unlike the Arista
# boards, this one is not on PCI at all.
#
# Driven by the C CLI, because the Go one cannot be built for this architecture.
# It probes the controller rather than trusting this name, so the name is here
# to say the board has a HAL at all.
platform_hal:
  driver: as5610-cpld

# The cooling curve. EdgeNOS's controller for this board idles at 40 C and is
# stepping hard by 50, so the band is placed around that.
#
# It matters more here than it looks: the board powers up with the fan duty at
# 31 of 31 and stays there, because nothing had ever commanded it otherwise.
# That is safe -- well under limits of 90-127 C -- and it is full speed on a
# switch that needs about a third of it.
thermal:
  min_c: 40
  max_c: 60
  slew_down_percent: 5

console: ttyS0
console_baud: 115200

# How this board's firmware reads its disk, and where it looks for the kernel.
#
# U-Boot 2013.01 here has NO GPT SUPPORT. Its binary carries no EFI or GUID
# partition strings at all -- only "## Unknown partition table" -- so the GPT
# layout every other NOSaic board uses would leave this switch unable to find
# anything on its own disk. Verified by dumping mtd3 ("uboot") and reading it,
# not assumed.
partition_table: dos

# A raw partition for the FIT, because this firmware loads a partition and not
# a file: `usbboot <addr> <dev>:<part>` is a block read. The vendor's own OS
# boots exactly this way, which makes it the one mechanism proven on this
# hardware -- newnos/installer/ONIE_ISSUES.md issue 12 records an attempt to use
# ext2load against an ext2 filesystem here and why it does not match the chain.
#
# 24 MiB against a FIT of about 11: room for the kernel and initramfs to grow
# without repartitioning a fleet.
fit_mib: 24

# A DOS table has four primaries and the FIT takes one, so there is no separate
# boot partition; the slot pointer lives on the data partition instead. Sized
# for a 3.7 GiB disk with room to grow rather than to fill it.
slot_mib: 384
data_mib: 512

# What the installer leaves in the firmware's own boot variable.
#
# Deliberately close to the vendor's: `usb start; usbiddev` is how this U-Boot
# reaches the disk at all, and usbboot is a raw partition read. What differs is
# the partition (1, our FIT) and the FIT configuration name (nosaic).
#
# ⚠ Only nos_bootcmd is written. newnos/BOOT.md records that setting fdt_high
# or initrd_high to 0xffffffff breaks both this NOS and ONIE, so the installer
# touches neither -- U-Boot's defaults place the FDT and initrd correctly.
u_boot_nos_bootcmd: "usb start; usbiddev; setenv bootargs console=ttyS0,115200 cma=32M; usbboot 0x10000000 ${usbdev}:1 && bootm 0x10000000#nosaic"
