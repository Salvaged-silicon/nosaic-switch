# Front-panel ports that appear on the Linux stack, as
#
#     tap_<ifname>=<logical port>:<vlan>[:<mtu>]
#
# The VLAN is the port's service VLAN, 3300+port, which nosd already created and
# where the port is the only untagged member. Naming it here rather than
# deriving it keeps the two in one place: a tap in a VLAN its port is not a
# member of sends frames the far end counts as received and then drops.
#
# Only ports with something plugged into them. A tap costs a file descriptor, a
# poll slot and a router interface, and 52 of them for a board with five cables
# is noise in every listing for no gain. Add a line when a cable arrives.
#
# Every port network.conf configures gets one, whether or not a cable is in it.
# The network service waits for all of them by name and blocks until they
# appear, so a port that is addressed but has no tap stalls the boot and takes
# FRR down with it -- which is what "NOSAIC-NET never appeared after 60s"
# meant. A tap on a dark port costs a file descriptor and a poll slot and
# reports no link, which is the honest answer.
#
# swp1 and swp2 face the Nexus, swp8 faces the Arista 7050SX2, swp6 has a
# neighbour sending router advertisements, and swp49/51/52 are the QSFP cages.
tap_swp1=1:3301
tap_swp2=2:3302
tap_swp4=4:3304
tap_swp5=5:3305
tap_swp6=6:3306
tap_swp7=7:3307
tap_swp8=8:3308
tap_swp49=49:3349
tap_swp51=51:3351
tap_swp52=52:3352
