port_init_autoneg_xe=0

# Counter collection is the third DMA user, and it fails the same way the other
# two do:
#
#   soc_counter_thread: DMA did not finish buf32=0xb3a71600
#   AbnormalThreadExit:soc_counter_thread: Too many errors
#
# The thread exits on its own, so it does not stop initialisation -- it just
# retries, fails, and prints, on a timer, forever. Zero means soc_counter_start
# returns before creating the thread (src/soc/common/counter.c:9327), so nothing
# is running to fail.
#
# The cost is that port and error counters read zero. Removing this belongs with
# the other two, when DMA works; until then, silence beats a stream of errors
# about a feature that is not running.
bcm_stat_interval=0

# The two threads that were eating the box, neither of which is forwarding.
#
# bcmMEM_SCAN is the soft-error scrubber. It walks every TCAM entry looking for
# bit flips, and with table DMA off it walks them one S-Channel read at a time:
#
#   soc_mem_read unit 0: L3_DEFIP.ipipe0[8191]: <VRF_ID_MASK1=0x3ff,...>
#
# 8192 of those for one table, then around again, forever. It also produced most
# of the log, which is worse than the CPU cost -- it buried what the main thread
# was doing under a scrubber reporting that memory it had never written was
# still empty. Soft errors are a real concern on a switch that has been up for
# months; they are not a concern for a chip that has not forwarded a frame yet.
mem_scan_enable=0
parity_enable=0

# bcmPOLL stands in for the interrupt line in polled mode, and the SDK's default
# delay is zero (src/soc/common/ipoll.c:27), which makes it sal_thread_yield()
# in a loop -- a whole core, permanently, on a 1 GHz P2020. A quarter of a
# millisecond between passes is far below anything the chip needs answered
# quickly and gives the rest of the system its CPU back.
polled_irq_delay=250
