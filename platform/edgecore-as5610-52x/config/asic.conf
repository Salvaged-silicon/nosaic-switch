# ASIC configuration for the Edgecore AS5610-52X (BCM56846, Trident+).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time
# through config_var_get. Every *.conf in /etc/nosaic is loaded in name order,
# so this file and portmap.conf are read together.
#
# THE PORT MAP IS NOT HERE, AND MUST NOT BE.
#
# The SDK cannot bring up a port without knowing which logical port is wired to
# which SerDes lane, and on this board that mapping was read off a machine
# running the vendor's OS -- Cumulus, per EdgeNOS's own bring-up notes: "Cumulus
# config.bcm: ports 1-8 -> lanes 65-72". The numbers are the vendor's and are
# not ours to publish, which is the same reason the 7050SX2's port map is
# absent. It lives in portmap.conf beside this file and is gitignored.
#
# The board's device tree is a different case and does ship: it is derived from
# Open Network Linux's, which is open source. Provenance decides this, not the
# file type.
#
# NO UNIT SUFFIXES. EdgeNOS's config.bcm writes `pbmp_valid.0` and
# `portmap_1.0`, because the SDK's own config.bcm parser understands
# `name.unit`. Nothing parses that here: the SDK asks config_var_get for the
# bare name, the unit being implied by the device it is asking about. A
# suffixed name is simply never matched, the property reads as unset, and for
# the port map that means the SDK walks its port table looking for a
# terminator nobody wrote -- which is a segfault in soc_counter_attach rather
# than a complaint about configuration.
#
# Everything below is generic SDK configuration -- what the chip should do,
# not how this board is wired.

# 1, not the 0 inherited from EdgeNOS, and the difference is that EdgeNOS has
# interrupts and this does not.
#
# It redirects the SDK's interrupt handler thread to poll the interrupt status
# register instead of waiting to be told. With no delivery at all, the handler
# is never entered, and anything whose completion is signalled through it waits
# out its timeout -- which is what a SLAM DMA that never finishes looks like.
#
# EdgeNOS's own BDE notes list "IRQ handling for DMA completion" as one of four
# reasons it reaches the chip through a kernel module. Three of the four are
# answered here: MMIO barriers by datapath/common/mmio.h, register access by
# the mapping, coherent memory by the reserved-memory pool. This is the fourth,
# answered by polling rather than by a kernel module.
polled_irq_mode=1
bcm_stat_flags=0x1
l2xmsg_mode=1
# EVERY PATH THAT CAN WAIT ON AN INTERRUPT MUST POLL, BECAUSE NOTHING DELIVERS
# ONE.
#
# polled_irq_mode above only redirects the SDK's own interrupt handler thread.
# Several data paths separately choose between waiting on an interrupt and
# polling, and each defaults to the interrupt. nosd-tdp's interrupt_connect is
# a stub -- this chip has a CMICe and the 7050SX2's uio_pci_generic path does
# not carry over unexamined -- so each of those waits forever and then fails
# its operation on a timeout.
#
# EdgeNOS sets all three to 1 and is right to: it reaches the chip through the
# SDK's kernel BDE, which delivers interrupts. Copying its config.bcm without
# copying its interrupt delivery produced
#
#   soc_misc_init(0) returned -9 (Operation timed out)
#
# which reads as a dead chip rather than a missing interrupt. The 7050SX2 hit
# the same wall during its bring-up and its asic.conf still explains it.
#
# These go back to 1 when the CMICe interrupt path exists.
miim_intr_enable=0
tdma_intr_enable=0
tslam_intr_enable=0
schan_intr_enable=0
# DMA off while bring-up is unfinished, and this is a bisect rather than a
# preference.
#
# The SDK programs tables either by DMA -- building a descriptor in the pool
# and having the chip fetch it -- or by writing them through S-Channel one at a
# time. The first depends on the chip seeing the pool at the physical address
# we think it has, which depends on the PCIe inbound window; the second does
# not. With both disabled, a table operation that still times out is not about
# DMA addressing.
#
# OFF, and this is a known-unfinished state rather than a setting.
#
# The bisect is clean now that the image can be trusted:
#
#   DMA on   soc_misc_init(0) returned -9 (Operation timed out)
#   DMA off  soc_misc_init ok, soc_mmu_init ok, reaches bcm_attach
#
# So the chip is not getting what the CPU writes into the pool. Ruled out: the
# PCIe inbound window, which reads as enabled, 2 GB and 1:1 over DRAM, so the
# address is reachable; and CPU cache, since implementing sflush and sinval
# with dcbf changed nothing.
#
# Off because it gets further, and table DMA is how the SDK programs most of
# the chip -- this is a crutch to be removed, not a choice to keep.
tslam_dma_enable=0
table_dma_enable=0
parity_enable=1
xgxs_lcpll_xtal_refclk=1
phy_ext_rom_boot=0
pbmp_xport_xe=0x1ffffffffffffe
pbmp_valid=0x2001fffffffffffff
port_init_duplex=1
port_init_speed_xe0=10000
port_init_speed_xe1=10000
port_init_speed_xe2=10000
port_init_speed_xe3=10000
port_init_speed_xe4=10000
port_init_speed_xe5=10000
