# ASIC configuration for the Edgecore AS5610-52X (BCM56846, Trident+).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time
# through config_var_get. Every *.conf in /etc/nosaic is loaded in name order,
# so this file and portmap.conf are read together.
#
# THE PORT MAP IS NOT HERE, AND MUST NOT BE.
#
# The SDK cannot bring up a port without knowing which logical port is wired to
# which SerDes lane, and on this board that mapping was read off a machine
# running the vendor's OS -- Cumulus, per EdgeNOS's own bring-up notes: "Cumulus
# config.bcm: ports 1-8 -> lanes 65-72". The numbers are the vendor's and are
# not ours to publish, which is the same reason the 7050SX2's port map is
# absent. It lives in portmap.conf beside this file and is gitignored.
#
# The board's device tree is a different case and does ship: it is derived from
# Open Network Linux's, which is open source. Provenance decides this, not the
# file type.
#
# NO UNIT SUFFIXES. EdgeNOS's config.bcm writes `pbmp_valid.0` and
# `portmap_1.0`, because the SDK's own config.bcm parser understands
# `name.unit`. Nothing parses that here: the SDK asks config_var_get for the
# bare name, the unit being implied by the device it is asking about. A
# suffixed name is simply never matched, the property reads as unset, and for
# the port map that means the SDK walks its port table looking for a
# terminator nobody wrote -- which is a segfault in soc_counter_attach rather
# than a complaint about configuration.
#
# Everything below is generic SDK configuration -- what the chip should do,
# not how this board is wired.

polled_irq_mode=0
bcm_stat_flags=0x1
l2xmsg_mode=1
miim_intr_enable=1
tdma_intr_enable=1
tslam_intr_enable=1
tslam_dma_enable=1
