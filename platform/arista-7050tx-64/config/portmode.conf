# QSFP cage mode for the Arista DCS-7050TX-64.
#
# A QSFP cage is four SerDes lanes. The chip can drive them as ONE 40G port
# whose PCS stripes across all four, or as FOUR independent 10G ports. This
# file chooses, per cage.
#
#   nosaic_portmode_<first logical port> = 40g | 4x10g
#
# This board's four cages are logical ports 49, 53, 57 and 61 -- Et49 to Et52.
# A cage occupies four logical numbers even when it is one 40G port, which is
# why they are four apart and not consecutive.
#
# ⚠ THE MODE IS READ DURING ATTACH AND NEVER AGAIN, SO A CHANGE TAKES A REBOOT.
# There is no runtime switch for this on Trident2. Changing it while the
# datapath is running does nothing and reports no error.
#
# ⚠ AND BOTH ENDS OF THE LINK MUST AGREE.
#
# This is not a preference, it is a property of the link. Four lanes in 4x10G
# each achieve PCS lock on their own; the same four in 40G mode must also
# deskew and align as a single PCS. So a pair that links perfectly at 4x10G can
# carry nothing at 40G with every lane locked, no symbol errors and no CRC
# errors -- and each end reporting something different from the other.
#
# That is why this file exists. Two cages on this board reached a neighbour on
# all eight lanes at 10G and would not pass a frame at 40G, under NOSaic and
# under the vendor's own OS alike -- which is what ruled out the optics, the
# fibre and this project's code in one test.
#
# Breaking a cage out also needs interfaces for the new ports: a 4x10G cage at
# 49 becomes logical ports 49, 50, 51 and 52, and each wants its own tap_etN in
# asic.conf and its own address in network.conf.
#
# The default for every cage is 40g, so a board that states nothing gets the
# generated port map exactly as it is.

nosaic_portmode_49 = 40g
nosaic_portmode_53 = 40g
nosaic_portmode_57 = 40g
nosaic_portmode_61 = 40g
