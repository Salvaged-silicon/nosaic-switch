# Chassis status lamps for the Arista DCS-7050TX-64.
#
# Shipped rather than generated, unlike the sibling board's, because nothing
# here is the vendor's board data:
#
#   - The register offsets are already public facts about this hardware and are
#     documented in docs/hardware.md. The SCD's layout is architecturally
#     consistent across Arista platforms and these blocks appear in Arista's own
#     published platform tree.
#   - The palette is the LEGACY encoding from Arista's published GPL scd-led
#     driver (led_brightness_set_legacy), not a value read out of a vendor file.
#
# ⚠ THE LAMPS ARE ON THE SCD HERE, NOT ON THE FAN CPLD.
#
# The sibling drives colour bits in a byte register on the fan CPLD over SMBus.
# This board takes a whole 32-bit word written straight to the SCD. Driving it
# the sibling's way sends an SMBus byte to a device that is not listening and
# leaves the panel dark with no error.
driver     = scd

status     = 0x6050
fan        = 0x6060
psu1       = 0x6070
psu2       = 0x6080

# ⚠ The beacon is listed because the block exists, and the driver refuses to
# write it: which word lights it blue has not been established, and this board
# is known to ignore the modern encoding's bit for it.
beacon     = 0x6090

# ⚠ WRITE-ONLY. These read back 0 with the panel lit, so a lamp can never be
# verified by read-back -- only by looking at the box.
#
# This is the 2014 "I5 FPGA" part, which wants the older encoding. Settled by
# experiment rather than by reading: the modern bit-27 form did nothing at all
# on status and PSU1, while these words lit fan and PSU2, and writing one value
# to all four blocks turned the whole panel green at once -- which is what
# makes it a palette rather than four coincidences.
off_word   = 0x0006ff00
green_word = 0x1006ff00
red_word   = 0x0806ff00

# No amber lamp on this panel, so a degraded state shows as a fault. Over-
# reporting a fault is the safe direction; the driver defaults to this anyway.
amber_word = 0x0806ff00
