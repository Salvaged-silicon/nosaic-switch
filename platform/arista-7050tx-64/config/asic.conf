# ASIC configuration for the Arista DCS-7050TX-64 (BCM56855, Trident2).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time
# through config_var_get.
#
# NOTHING KEYED ON A PORT IS HERE, AND NOTHING KEYED ON A PORT MAY BE.
#
# That is the rule this file is split on, and it is stricter than it looks. The
# board's own config.bcm carries 543 properties. 517 of them end in a port
# number, and every one of those describes how this particular board is wired:
#
#   portmap_<n>                     which physical SerDes lane reaches which
#                                   logical port
#   phy_xaui_{tx,rx}_polarity_flip  which lanes the PCB inverts
#   port_phy_addr_<n>               the MDIO address of that port's external PHY
#   phy_mdi_pair_map_<n>            how the copper pairs land on the RJ45
#   phy_bus_i2c_<n>, phy_long_xfi_<n>, phy_fiber_pref_<n>, phy_an_c*_<n>
#   port_init_autoneg_<n>
#
# None of it is published anywhere. It was read from the vendor's software on a
# switch that has it, which makes it vendor-derived, so NOSaic ships the
# generator and not its output -- see tools/. The daemon loads those files
# alongside this one, and reports itself unconfigured without them.
#
# GUESSING DOES NOT WORK, and it fails in a way that looks like working. A
# sequential port map satisfies every bandwidth rule the chip enforces and
# reaches none of the right cages. On this board the copper case is worse than
# the SX2's: get port_phy_addr_<n> wrong and the SDK talks to the wrong PHY, so
# a port reports a link that belongs to a different socket.
#
# The 26 properties below are what is left: they describe the ASIC as this
# model configures it, not as this unit is wired, and they are the same class
# of data the sibling board ships.

# Poll for interrupts rather than taking an IRQ line.
#
# NOSaic's BDE has no interrupt to connect: it reaches the chip by mapping the
# PCI BAR from userspace, which is how the vendor OS reaches it too, and there
# is no kernel driver bound to route a vector to us.
polled_irq_mode=1
miim_intr_enable.0=0

# ⚠ Required on this board in a way it is not on the SX2. The 48 front-panel
# ports are 10GBASE-T behind external BCM84848 PHYs, and those PHYs run
# firmware that the SDK downloads over MDIO at init. Without this the PHYs are
# present, answer on the bus, and never link.
load_firmware=0x101
phy_ext_rom_boot=0

# Put the 48 external PHYs on the SDK's MDIO bus.
#
# ⚠ Port-keyed, and shipped anyway -- the one exception to the rule at the top
# of this file. It appears nowhere in the vendor's own configuration: it is
# ours, and it is the same value for every copper port. The rule exists to keep
# out what the vendor knows about this individual unit, and a uniform switch we
# turned on is not that.
#
# Without it the SDK never binds an external PHY driver. `phy info` then reports
# every port as the internal SerDes and all 48 copper ports are dead, with
# nothing saying why.
phy_bus_i2c_1.0=1
phy_bus_i2c_2.0=1
phy_bus_i2c_3.0=1
phy_bus_i2c_4.0=1
phy_bus_i2c_5.0=1
phy_bus_i2c_6.0=1
phy_bus_i2c_7.0=1
phy_bus_i2c_8.0=1
phy_bus_i2c_9.0=1
phy_bus_i2c_10.0=1
phy_bus_i2c_11.0=1
phy_bus_i2c_12.0=1
phy_bus_i2c_13.0=1
phy_bus_i2c_14.0=1
phy_bus_i2c_15.0=1
phy_bus_i2c_16.0=1
phy_bus_i2c_17.0=1
phy_bus_i2c_18.0=1
phy_bus_i2c_19.0=1
phy_bus_i2c_20.0=1
phy_bus_i2c_21.0=1
phy_bus_i2c_22.0=1
phy_bus_i2c_23.0=1
phy_bus_i2c_24.0=1
phy_bus_i2c_25.0=1
phy_bus_i2c_26.0=1
phy_bus_i2c_27.0=1
phy_bus_i2c_28.0=1
phy_bus_i2c_29.0=1
phy_bus_i2c_30.0=1
phy_bus_i2c_31.0=1
phy_bus_i2c_32.0=1
phy_bus_i2c_33.0=1
phy_bus_i2c_34.0=1
phy_bus_i2c_35.0=1
phy_bus_i2c_36.0=1
phy_bus_i2c_37.0=1
phy_bus_i2c_38.0=1
phy_bus_i2c_39.0=1
phy_bus_i2c_40.0=1
phy_bus_i2c_41.0=1
phy_bus_i2c_42.0=1
phy_bus_i2c_43.0=1
phy_bus_i2c_44.0=1
phy_bus_i2c_45.0=1
phy_bus_i2c_46.0=1
phy_bus_i2c_47.0=1
phy_bus_i2c_48.0=1

# Core clock and reference. force_core_pll_freq is in MHz.
force_core_pll.0=1
force_core_pll_freq.0=415
xgxs_lcpll_xtal_refclk.0=1

# MDIO output delay. The copper PHYs are reached over this bus, and the
# datapath depends on it being healthy -- see the MDIO budget note in
# docs/hardware.md.
mdio_output_delay=0x0d

# Which ports exist, as a bitmap. 52 ports: 48 copper plus the first lane of
# each of the four QSFP+ cages.
pbmp_xport_xe.0=0x3ffffffffffffffe
module_64ports.0=1

# Forwarding table sizing.
l2_mem_entries.0=163840
l3_mem_entries.0=147456
ipv6_lpm_128b_enable.0=2
max_vp_lags.0=0

# Frames and switching behaviour.
bcm_stat_flags=1
bcm_stat_jumbo.0=9236
cut_through=1
cut_through.0=1
higig2_hdr_mode.0=1
port_init_cl72_hg.0=0x11

# Timeouts, all 15 seconds. Generous, and deliberately so: these bound SDK
# operations that block, and a short timeout on a busy MDIO bus turns a slow
# read into a failed one.
arl_clean_timeout_usec=15000000
cdma_timeout_usec.0=15000000
dma_desc_timeout_usec.0=15000000
tdma_timeout_usec.0=15000000
tslam_timeout_usec.0=15000000

l2xmsg_mode.0=1
os=unix

# Which ports appear on the Linux network stack, and as what.
#
#     tap_<interface name>=<logical port>:<vlan>:<mtu>
#
# The datapath creates a tap device per entry and bridges it to that hardware
# port, so a routing daemon is configured against the name and never has to
# know a switch chip is involved. The names here are the ones config/network.conf
# addresses and frr.conf will run OSPF over; a tap whose name does not match
# that file is an interface nothing configures.
#
# The VLAN is dedicated per routed port and egresses untagged. Without it the
# chip tags what it sends, and a routed neighbour counts the frames as received
# AND dropped -- which reads as nothing arriving.
#
# ⚠ THE FRONT-PANEL NUMBER IS NOT THE LOGICAL PORT ABOVE ET48.
#
# A QSFP cage occupies four consecutive logical ports even when it runs as one
# 40G port, so the four cages are logical 49, 53, 57 and 61 -- not 49 to 52.
# Et50 is logical 53. Using the panel number instead configures a port in the
# middle of the previous cage: it is a real port, it will not link, and nothing
# says why. See docs/hardware.md.
#
# Only the cabled cages get a tap. A tap on a dark cage costs a VLAN, a router
# interface and a MY_STATION entry to present an interface nothing can reach,
# and bridging all 52 ports would create 52 interfaces the kernel polls for
# nothing.
#
# Et49 and Et50 -> the 7050SX2's Et52 and Et53, the ECMP pair.
tap_et49=49:1049:1600
tap_et50=53:1050:1600
# Et52 -> the Edgecore AS5610. Et51 (logical 57) is not cabled.
tap_et52=61:1052:1600

# ⚠ DO NOT SET phy_an_c73_61 TO 1 HERE.
#
# The predecessor project's configuration file carries that value and this
# board's own captured configuration does not, so it was copied across as "the
# working value". It is not: with clause-73 autoneg enabled on a cage whose
# neighbour does not negotiate, this end transmits autoneg pages instead of
# data. We lock onto the neighbour's idles and report the port up at 40000
# while the neighbour never links at all -- which is exactly what Et52 to the
# Edgecore AS5610 did, and the far end confirmed it with `swp52 up/down` while
# our side said link=1.
#
# Every cage on this board that works has the captured value, 0. The
# predecessor's file is not evidence on its own: a property it sets is not
# necessarily a property its code paths let reach the chip.
