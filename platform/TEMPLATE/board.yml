# NOSaic board port. Copy this directory to platform/<id>/ and fill it in.
# The directory name must match `id`.

id: TEMPLATE                 # unique, matches the directory name
vendor: ""                   # e.g. arista, accton, juniper
model: ""                    # e.g. 7050tx-64

# The orthogonal axes. arch and boot name directories (arch/<arch>, boot/<boot>);
# asic selects which nosd provider this board installs.
arch: ""                     # x86_64 | aarch64 | powerpc | armhf
asic: ""                     # e.g. td2, tdp, helix4, prestera, virt
boot: ""                     # virt | aboot | onie-sfx | uboot

# Only for boot: uboot. Where in RAM the kernel is loaded, which is a property
# of the SoC -- there is no safe default, and a wrong one hangs the board with
# nothing on the console.
# u_boot_arch: ppc
# u_boot_load: "0x01000000"
# u_boot_entry: "0x01000000"

profile: full                # full | slim | minimal
kernel: ""                   # empty means the fleet default

status: planned              # planned | bringup | experimental | production

notes: >
  What is unusual about this board. Hard-won findings belong here: register
  quirks, access paths that silently fail, firmware that must load before a
  port will link. This is the most valuable file in the directory.
