# QSFP cage mode for the Cisco Nexus 3172TQ.
#
# A QSFP cage is four SerDes lanes. The chip can drive them as ONE 40G port
# whose PCS stripes across all four, or as FOUR independent 10G ports. This
# file chooses, per cage.
#
#   nosaic_portmode_<first logical port> = 40g | 4x10g
#
# This board's six cages are logical ports 49, 53, 57, 61, 65 and 69 --
# Eth1/49 to Eth1/54. A cage occupies four logical numbers even when it is one
# 40G port, which is why they are four apart and not consecutive.
#
# ⚠ THE MODE IS READ DURING ATTACH AND NEVER AGAIN, SO A CHANGE TAKES A REBOOT.
# There is no runtime switch for this on Trident II. Changing it while the
# datapath is running does nothing and reports no error.
#
# ⚠ AND BOTH ENDS OF THE LINK MUST AGREE. Four lanes in 4x10G each achieve PCS
# lock on their own; the same four in 40G mode must also deskew and align as a
# single PCS. So a pair that links perfectly at 4x10G can carry nothing at 40G
# with every lane locked, no symbol errors and no CRC errors -- and each end
# reporting something different from the other. Two cages on the Arista sibling
# did exactly that, under NOSaic and under the vendor's own OS alike.
#
# ⚠ THE CAGES HERE ARE RETIMED, WHICH THE ARISTA'S ARE NOT.
#
# A BCM84328 sits between the ASIC and each cage, on the first lane of the
# group -- the other three read `Null` in the SDK's PHY inventory, and the
# vendor sets phy_84328_<n>=1 for all 24 ports in 49..72 to mark the cage while
# the PHY instance belongs to the master lane. What a retimer does to breakout
# mode is not established on this board: whether the SDK reconfigures the
# BCM84328 for four independent 10G channels, or whether the part has to be
# told separately, is an open question and the first thing to check if a
# broken-out cage links and carries nothing.
#
# Breaking a cage out also needs interfaces for the new ports: a 4x10G cage at
# 49 becomes logical ports 49, 50, 51 and 52, each wanting its own tap_ line in
# asic.conf, its own address in network.conf, and its lanes present in
# pbmp_xport_xe.
#
# The default for every cage is 40g, so a board that states nothing gets the
# generated port map exactly as it is. All six are stated anyway, because a
# file that lists every cage is a file somebody can read the board off.

nosaic_portmode_49 = 40g
nosaic_portmode_53 = 40g
nosaic_portmode_57 = 40g
nosaic_portmode_61 = 40g
nosaic_portmode_65 = 40g
nosaic_portmode_69 = 40g
