# ── What is NOT here, and where it is instead ───────────────────────────────
#
# ⚠ NO scd_pci. The 7050TX-64 states one, because its 48 copper PHYs hang off
# the Arista SCD's MDIO accelerators rather than the switch chip's own bus, and
# the datapath has to map that device to reach them.
#
# This board is the other arrangement: the PHYs are on the ASIC's own MDIO bus,
# owned by the SDK, exactly as the generated port map describes. Cisco's board
# controller -- CCTRL, their SCD -- carries the sensors, fan zones and PSU
# state and has nothing to do with the PHYs. Stating an scd_pci here would
# point the datapath at a device that does not do this job.
#
# ⚠ NO TRANSMIT EQUALISATION, AND NO GENERATOR FOR IT. Every port on this board
# has a PHY in front of it, cages included -- the 40G cages are retimed through
# BCM84328s rather than direct-attach -- so nothing drives a channel off the
# ASIC SerDes and there is no per-trace tuning to capture. The vendor's own
# configuration for this board contains no preemphasis and no TX-FIR
# coefficients, and the SerDes library named for this platform is a 4 KB stub
# whose lane accessor returns NULL. See docs/hardware.md.
