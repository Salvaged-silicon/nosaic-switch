# ASIC configuration for the Cisco Nexus 3172TQ (BCM56854_A2, Trident II).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time
# through config_var_get.
#
# NOTHING KEYED ON A PORT IS HERE, AND NOTHING KEYED ON A PORT MAY BE.
#
# That is the rule this file is split on. The vendor's own configuration for
# this board carries 568 properties, and around 500 of them end in a port
# number describing how this particular board is wired:
#
#   portmap_<n>                     which physical SerDes lane reaches which
#                                   logical port
#   port_phy_addr_xe<n>             the MDIO address of that port's PHY
#   phy_mdi_pair_map_<n>            how the copper pairs land on the RJ45
#   phy_84848_<n>, phy_84328_<n>    which PHY part is in front of that port
#   phy_xaui_rx_polarity_flip_<n>   which lanes the PCB inverts
#   xgxs_{tx,rx}_lane_map_xe<n>     the per-core lane swizzle
#   phy_port_primary_and_offset_xe<n>, phy_aux_voltage_enable_<n>
#
# None of it is published anywhere. It was read out of the vendor's running
# SDK on a switch that has one, which makes it vendor-derived -- so NOSaic
# ships the generators and not their output. See tools/. The daemon loads those
# files alongside this one and reports itself unconfigured without them.
#
# GUESSING DOES NOT WORK, AND IT FAILS IN A WAY THAT LOOKS LIKE WORKING. A
# sequential port map satisfies every bandwidth rule the chip enforces and
# reaches none of the right cages. This board makes it worse than most:
#
#   * the physical lane numbering has three gaps -- the 48 copper ports occupy
#     lanes 13-16, 21-32 and 45-76, and the six cage masters are 77, 81, 97,
#     101, 105 and 109, so 17-20, 33-44 and 85-96 are all skipped;
#   * the PHY MDIO addresses are swapped in pairs -- xe0 answers at 1, xe1 at
#     0, xe2 at 3, xe3 at 2. A wrong MDIO address talks to a real PHY belonging
#     to a different socket, so a port reports another port's link state and
#     nothing errors.
#
# What is below is what is left: the properties that describe the ASIC as this
# MODEL configures it, not as this unit is wired. Values marked "vendor" were
# read from the running SDK's `config show`; the rest are ours, and say why.

# Poll for interrupts rather than taking an IRQ line through the SDK.
#
# NOSaic's BDE maps the PCI BAR from userspace and has no interrupt to connect
# on the SDK's own terms; uio_pci_generic delivers INTx separately. The vendor
# sets miim_intr_enable=0 too, and reaches the chip from userspace for the same
# reason -- its daemon is literally called t2usd, Trident 2 User Space Driver.
# Where it differs is underneath: it keeps Broadcom's kernel BDE modules, which
# it can only do because NX-OS here runs kernel 3.4.91, far below the BDE's
# 4.16 ceiling. We run 6.12.
polled_irq_mode=1
miim_intr_enable.0=0
schan_intr_enable=0

# ⚠ REQUIRED, AND THE VALUE IS NOT THE ARISTA'S.
#
# Every front-panel port on this board sits behind an external PHY that runs
# firmware the SDK downloads over MDIO at init. Without a firmware load the
# PHYs are present, answer on the bus, and never link.
#
# The vendor uses 0x2 here where the 7050TX-64 uses 0x101. Kept as the vendor's
# because it is the value proven on THIS board's PHY population -- 48 BCM84848
# plus 6 BCM84328 -- and the flag bits select which PHY families get a
# download. The Arista board has no BCM84328 at all.
load_firmware=0x2
phy_ext_rom_boot.0=0
phy_force_firmware_load=0

# MDIO output delay. Vendor's 0x8 for this board; the Arista's is 0x0d. Both
# copper boards depend on a healthy MDIO bus -- the PHY firmware download goes
# over it -- and the delay is a board electrical property, not a preference.
mdio_output_delay=0x8

# ⚠ WHICH PORTS EXIST, AND THIS IS NOT THE VENDOR'S BITMAP.
#
# The vendor drives all 72 logical ports: pbmp_xport_xe=0x1fffffffffffffffffe,
# bits 1..72, with the 18 subordinate QSFP lanes flagged `:i` in its port map.
#
# NOSaic runs the six cages as one 40G port each, so 54 ports: bits 1..48 for
# the copper, plus 49, 53, 57, 61, 65 and 69 -- the first lane of each cage.
# A cage occupies four logical numbers even as a single 40G port, which is why
# they are four apart and not consecutive.
#
# This must agree with the generated port map. A bitmap claiming ports the map
# does not describe, or a map with more entries than the bitmap admits, is the
# failure mkportmap.sh counts entries to catch.
#
# Breaking a cage out into 4x10G is config/portmode.conf's job, and a cage
# broken out needs its extra lanes here too.
pbmp_xport_xe.0=0x222223fffffffffffe

# Core clock and reference.
#
# ⚠ NOT FORCED, UNLIKE THE ARISTA BOARD. The vendor leaves force_core_pll at 0
# and lets the SDK derive the frequency for this part; the 7050TX-64's config
# pins it to 415 MHz. Forcing a frequency the board's reference cannot produce
# is not a subtle failure, so this follows the vendor rather than the sibling.
force_core_pll=0
xgxs_lcpll_xtal_refclk.0=1

# Forwarding table sizing. Vendor's values for this board.
#
# ⚠ l3_mem_entries is 16384 here against the 7050TX-64's 147456, and that is
# the vendor's number for a 3172TQ rather than a transcription error. It is a
# carve of shared memory, so a larger L3 table is a smaller L2 one -- and this
# board's L2 is 294912 against the Arista's 163840. A ToR sold for east-west
# switching is configured for MAC addresses; raise l3 here and l2 pays for it.
l2_mem_entries.0=294912
l3_mem_entries.0=16384
max_vp_lags.0=0

# IPv6 longest-prefix match. Vendor's mode 1 with 256 128-bit entries.
ipv6_lpm_128b_enable.0=1
num_ipv6_lpm_128b_entries=256

# L2 learning through the host CPU's message queue rather than in hardware
# alone, which is what lets the control plane see a learned address.
l2xmsg_mode.0=1
l2xmsg_hostbuf_size=16384
l2delete_chunks=20000

# Memory parity checking on. The vendor enables it; a TD2 with parity reporting
# off silently returns corrupt table reads rather than reporting an error.
parity_enable=1

# Counters and accounting. port_uc_mc_accounting_combine is the vendor's, and
# it changes what the per-port counters mean -- unicast and multicast share one
# set rather than being reported separately.
bcm_stat_flags=1
port_uc_mc_accounting_combine=1

# Timeouts, all 15 seconds. Generous and deliberately so: these bound SDK
# operations that block, and a short timeout on a busy MDIO bus turns a slow
# read into a failed one. This board's MDIO bus carries 54 PHY firmware
# downloads at init.
arl_clean_timeout_usec=15000000
cdma_timeout_usec.0=15000000
dma_desc_timeout_usec.0=15000000
tdma_timeout_usec.0=15000000
tslam_timeout_usec.0=15000000

os=unix

# ── Autonegotiation clause selection, global on this board ──────────────────
#
# Vendor's values. On the Arista sibling these are per-port and one of them is
# the subject of that board's loudest warning: with clause-73 autoneg enabled
# on a cage whose neighbour does not negotiate, this end transmits autoneg
# pages instead of data, locks onto the neighbour's idles, and reports the port
# up at 40000 while the neighbour never links at all.
#
# This board sets them globally, and it sets c73 OFF. Kept as the vendor's,
# which is also the value that avoids that failure.
phy_an_c37=0x3
phy_an_c73=0x0

# SerDes firmware mode for the xe ports, and how long a loss-of-signal must
# persist before it is believed. Vendor's values.
serdes_firmware_mode_xe=0x1
serdes_tx_los_usec=5000

# ⚠ THE MDIO CLOCK DIVISOR USED WHILE PHY FIRMWARE IS DOWNLOADED.
#
# Global here, where the Arista board has it per-port as
# rate_ext_download_mdio_divisor_<n>. It matters more on this board than on
# that one: 54 external PHYs get a firmware download over one MDIO bus at
# init, so the bus is driven harder and for longer than anywhere else in the
# fleet. Too fast and the download corrupts; the PHY then answers on the bus
# and never links, which is indistinguishable from no firmware at all.
rate_ext_mdio_divisor.0=0x80

# L3 behaviour. Vendor's values, and both are about what a routed interface
# does at egress rather than about capacity.
l3_max_ecmp_mode=1
l3_intf_vlan_split_egress=1

# ── Vendor properties deliberately NOT copied ───────────────────────────────
#
# Each of these is in the capture and each is left out on purpose, because a
# property copied for being present is a property nobody decided.
#
#   bcm_linkscan_interval=0     Disables the SDK's linkscan thread. NX-OS does
#                               its own link management through ethpm and does
#                               not want the SDK's. NOSaic relies on it, so
#                               copying this would leave every port's link
#                               state frozen at whatever it was at attach.
#
#   knet_filter_persist=1       KNET only. The vendor punts through Broadcom's
#                               kernel module; our datapath owns the DMA rings
#                               from userspace and bridges to tap devices, so
#                               there is no KNET here for this to apply to.
#
#   l3_disable_add_to_arl=1     Stops L3 interface MACs being added to the L2
#                               table. Correct for the vendor's forwarding
#                               model and not obviously correct for ours --
#                               our routed ports are taps on a dedicated VLAN
#                               each, and whether they need an ARL entry has
#                               not been established. Left off rather than
#                               copied, so if it turns out to be needed it is
#                               a change somebody made.
#
#   dport_map_*, pbmp_oversubscribe, parity/phy defaults of 0
#                               Defaults, or vendor-internal port remapping we
#                               have no use for.
#
# ⚠ AND SOME NAMES IN THE CAPTURE ARE TRUNCATED. `config show` on this SDK
# prints `pci2eb_overrid`, `phy_autoneg_ti`, `phy_bus_` and others cut short.
# A truncated name in a configuration file is a property that silently never
# takes effect, which is why the generators emit only the families they
# recognise and why nothing here was transcribed from that part of the output.

# ── Which ports appear on the Linux network stack, and as what ───────────────
#
#     tap_<interface name>=<logical port>:<vlan>:<mtu>
#
# The datapath creates a tap device per entry and bridges it to that hardware
# port, so a routing daemon is configured against the name and never has to
# know a switch chip is involved. The names here are the ones config/network.conf
# would address; a tap whose name does not match that file is an interface
# nothing configures.
#
# The VLAN is dedicated per routed port and egresses untagged. Without it the
# chip tags what it sends, and a routed neighbour counts the frames as received
# AND dropped -- which reads as nothing arriving.
#
# ⚠ THE FRONT-PANEL NUMBER IS NOT THE LOGICAL PORT ABOVE Eth1/48.
#
# The six cages are logical 49, 53, 57, 61, 65 and 69 -- so Eth1/50 is logical
# 53, not 50. Using the panel number configures a port in the middle of the
# previous cage: a real port that will not link, with nothing saying why.
#
# ⚠ NOTHING IS BRIDGED YET, AND THAT IS NOT AN OVERSIGHT.
#
# Which ports appear on the Linux network stack, and as what.
#
#     tap_<interface name>=<logical port>:<vlan>:<mtu>
#
# The datapath creates a tap device per entry and bridges it to that hardware
# port, so a routing daemon is configured against the name and never has to
# know a switch chip is involved. These names are what config/network.conf
# addresses; a tap whose name does not match that file is an interface nothing
# configures.
#
# The names follow the vendor's panel numbering -- Ethernet1/31 is eth1_31 --
# because the point of naming a port is that it is the one written on the
# chassis. Do not confuse them with eth0, which is the management NIC.
#
# ⚠ EVERY PORT GETS A TAP, INCLUDING THE DARK ONES. THIS IS DELIBERATE AND IT
# ⚠ DIFFERS FROM THE 7050TX-64 REFERENCE, WHICH DECLARES ONLY CABLED PORTS.
#
# That reference is wrong on this point and it is worth saying why, because
# the reasoning that produced it is superficially sound. Its argument is cost:
# a tap on a dark port spends a VLAN, a router interface and a MY_STATION
# entry to present an interface nothing can reach. All true, and all
# irrelevant -- 54 of each on a Trident II is 54 VLANs out of 4094 and 54 L3
# interfaces out of thousands.
#
# What the policy actually costs is the thing a switch is for. This file is
# read once, when the datapath starts. A port with no tap is not an interface
# that is down; it is an interface that does not exist. Plugging a cable into
# it does nothing, shows nothing and logs nothing until somebody edits this
# file and restarts nosd -- so the set of ports you can use is decided at
# build time by whoever last wrote the config, not by whoever is holding the
# cable. No operator expects that, and nothing in the system says it.
#
# Declaring all 54 makes a new cable behave the way a cable is supposed to:
# the interface is already there, already down, and comes up on its own.
#
# ⚠ THE PANEL NUMBER IS NOT THE LOGICAL PORT ON THE CAGES.
#
# A QSFP cage occupies four consecutive logical ports even when it runs as one
# 40G port, so the six cages are logical 49, 53, 57, 61, 65 and 69 -- not 49
# to 54. Panel 50 is logical 53. Using the panel number instead configures a
# port in the middle of the previous cage: a real port, which will not link,
# and nothing says why.
#
# Below the cages the panel number IS the logical port, and on this board that
# is measured rather than assumed: with a cable in panel 31 and 32 the
# datapath reported logical 31 and 32 UP at 10000, which is the only
# independent check the generated port map has had.
#
# A VLAN per port, 1000 + the panel number, egressing untagged. Without it the
# chip tags what it sends and a routed neighbour counts the frames as received
# AND dropped, which reads as nothing arriving.
#
# MTU 1500 everywhere. A transit link wanting 1600 is a two-line change, but
# ⚠ BOTH ENDS MUST BE CHANGED TOGETHER -- a mismatch passes small frames and
# silently drops the rest, which reads as an intermittent cable.
#
# eth1_31 and eth1_32 are patched to panel 31 and 32 of the lab's Arista
# 7050TX-64, the same ASIC generation and the same copper PHY. Until that
# cable existed neither board had a neighbour to route to, so proving traffic
# there proves it for both. ⚠ That board declares no taps on 31/32 either --
# its own config needs the matching pair.

# The 48 copper ports. 10GBASE-T behind BCM84848s; panel == logical.
tap_eth1_1=1:1001:1500
tap_eth1_2=2:1002:1500
tap_eth1_3=3:1003:1500
tap_eth1_4=4:1004:1500
tap_eth1_5=5:1005:1500
tap_eth1_6=6:1006:1500
