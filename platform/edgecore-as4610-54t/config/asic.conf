# ASIC configuration for the Edgecore AS4610-54T (BCM56340, Helix4).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time
# through config_var_get. Every *.conf in /etc/nosaic is loaded in name order,
# so this file and phymap.conf are read together.
#
# THE PHY WIRING IS NOT HERE, AND MUST NOT BE.
#
# The SDK cannot reach a copper port without knowing which MDIO address that
# port's external PHY answers on, and no public document publishes that for
# this board. It is read off a machine running the vendor's software, which
# makes it vendor-derived -- the same rule the Arista boards' port maps follow.
# Generate it once with tools/mkphymap.sh and drop the result in phymap.conf
# beside this file, which is gitignored.
#
# WHAT IS HERE IS EITHER CHIP BEHAVIOUR OR PUBLISHED PRODUCT SHAPE.
#
# The port bitmaps below are not read out of anybody's file: they follow from
# what this switch is sold as -- 48 copper ports and 6 SFP+ cages -- and from
# Helix4's own fixed logical port numbering, in which the GE block starts at 1
# and the XE block at 50. Helix4 has no portmap_<n> properties at all, which is
# the useful difference from the Trident boards: on those, which logical port
# reaches which SerDes lane is board wiring and has to be discovered. Here it
# is fixed in the silicon.
#
# NO UNIT SUFFIXES. The vendor's file writes `pbmp_xport_xe.0` and
# `phy_5464S_xe0.0`, because the SDK's own config.bcm parser understands
# `name.unit`. Nothing parses that here: the SDK asks config_var_get for the
# bare name, the unit being implied by the device it is asking about. A
# suffixed name is never matched and reads as unset -- see the AS5610's
# asic.conf for what that costs when it happens to the port map.

# ── What this board is ───────────────────────────────────────────────────────

# The four SFP+ uplinks. Without it the chip comes up with the 10G block
# configured as something else and the cages are not ports at all.
bcm56340_4x10=1

# 48 copper ports on logical 1..48, six 10G ports on logical 50..55.
#
# The GE bitmap has 49 bits set, not 48, and that is copied from the vendor
# rather than corrected: bit 49 is a logical port in the GE block that this
# board does not bring out to a cage. Which one, and why it is enabled, is not
# established -- it is recorded in docs/hardware.md as an open question rather
# than quietly trimmed, because a bitmap that disagrees with the chip's own
# port configuration is a bring-up failure with no useful message.
pbmp_xport_ge=0x3fffffffffffe
pbmp_xport_xe=0xfc000000000000

# ── Table sizes ──────────────────────────────────────────────────────────────
#
# 16K L2 entries and 8K L3. Helix4 is an access part and these are its whole
# forwarding capacity -- worth knowing before promising a route table.
l2_mem_entries=0x4000
l3_mem_entries=0x2000
bcm_num_cos=8

# IPv6 /128 host routes without reserving half the LPM table for them.
ipv6_lpm_128b_enable=0x1
lpm_ipv6_128b_reserved=0
lpm_scaling_enable=1
l3_max_ecmp_mode=1

# ── Bring-up behaviour ───────────────────────────────────────────────────────

# The copper PHYs autonegotiate; the SFP+ cages do not and prefer fibre. Both
# are properties of what is soldered to the board rather than of one unit.
phy_sgmii_autoneg_ge=1

# No PHY firmware in an external ROM: the 10G PHYs take their microcode from
# the host. Left at 0 as the vendor has it.
phy_ext_rom_boot=0

# Counter collection interval, in microseconds. Two seconds, as the vendor's.
bcm_stat_interval=2000000

# DMA timeouts. Three seconds each, and generous on purpose -- these are the
# ceiling on how long the SDK waits for the chip to finish a table or SLAM
# transfer, and a timeout here is reported as a chip that did not answer.
cdma_timeout_usec=3000000
tdma_timeout_usec=3000000

# The SDK's own diagnostic shell tables, which nothing here uses. Off, because
# they are megabytes of strings in a daemon on a board with 768 MB.
help_cli_enable=0
memlist_enable=0
reglist_enable=0

# ⚠ INTERRUPTS ARE NOT DECIDED HERE YET.
#
# The vendor's file sets schan_intr_enable=0 and miim_intr_enable=0, which
# makes the SDK poll for S-Channel and MDIO completion rather than wait to be
# told. The AS5610 needs the equivalent because nothing delivers that chip's
# interrupt to userspace at all.
#
# This board may not need it: its CMIC is a platform device with a real
# interrupt (SPI 162), and binding it to uio_pdrv_genirq gives the datapath
# daemon that interrupt through /dev/uio0. Whether the SDK's handler can be
# driven from there is untested, so nothing is claimed -- the properties are
# deliberately absent, and docs/todo.md carries it as work rather than this
# file carrying a guess. If bring-up hangs waiting for a DMA that has already
# finished, these two are the first thing to add.
