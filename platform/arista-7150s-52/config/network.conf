# Network configuration for the Arista DCS-7150S-52.
#
#   iface <name> <address/prefix> [mtu <n>] [mac <addr>]
#   route <prefix|default> via <gateway> [dev <iface>]

# Management. A BCM5785 southbridge function (14e4:1699) driven by tg3 -- a
# normal NIC, present whether or not the ASIC is, which on this board matters
# more than usual because the ASIC is absent until something releases it.
#
# ⚠ THE MAC IS STATED HERE AND SHOULD NOT HAVE TO BE.
#
# It is not in the NIC. It lives in prefdl on an i2c SEEPROM, which nothing in
# NOSaic reads yet, so tg3 finds no address and would otherwise abort its probe
# or come up with a random one. The value below is this chassis's own
# MacAddrBase, read from its prefdl on 2026-09-23.
#
# This is a stopgap and should disappear. Once the prefdl reader exists the
# board supplies its own identity and no configuration file should be asserting
# hardware identity -- the sibling 7050SX2 carries the same stopgap and the
# same note, and the two should be deleted together.
iface eth0 10.10.33.2/24 mac 44:4c:a8:31:5d:aa

# Back to the lab, via the AS4610 on the management segment. ge33 there is
# 10.10.33.1/24.
route default via 10.10.33.1
