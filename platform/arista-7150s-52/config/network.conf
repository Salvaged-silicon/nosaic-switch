# Network configuration for the Arista DCS-7150S-52.
#
#   iface <name> <address/prefix> [mtu <n>] [mac <addr>]
#   route <prefix|default> via <gateway> [dev <iface>]

# Management. A BCM5785 southbridge function (14e4:1699) driven by tg3 -- a
# normal NIC, present whether or not the ASIC is, which on this board matters
# more than usual because the ASIC is absent until something releases it.
#
# The MAC is not in the NIC. It lives in prefdl on an i2c SEEPROM, so tg3 finds
# no address and would otherwise come up with a random one, and a switch whose
# identity changes every boot is not a switch anyone can find twice.
#
# "mac board" means read it from the hardware. It used to be a literal here --
# this chassis's own MacAddrBase, copied in by hand on 2026-09-23 -- and that
# made the IMAGE chassis-specific: flash it onto a second 7150S-52 and two
# boxes claim one address. The value belongs to the unit, so the unit is asked.
#
# The EEPROM's location is board data, in board.yml: host i2c-1 address 0x52.
iface eth0 10.10.33.2/24 mac board

# Back to the lab, via the AS4610 on the management segment. ge33 there is
# 10.10.33.1/24.
route default via 10.10.33.1
