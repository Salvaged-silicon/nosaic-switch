frr version 10.2
frr defaults traditional
hostname nosaic-7150s
log syslog informational
service integrated-vtysh-config
!
interface et1
 ip ospf cost 40
 ip ospf area 0.0.0.0
!
interface et2
 ip ospf cost 40
 ip ospf area 0.0.0.0
!
interface lo
 ip ospf passive
 ip ospf area 0.0.0.0
!
router ospf
 ospf router-id 10.101.255.1
 redistribute connected
!
