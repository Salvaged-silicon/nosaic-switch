# Arista DCS-7150S-52 — Intel/Fulcrum FM6000 "Alta" (SID "SantaRosa", platform "raven").
#
# The first board in this tree that is not Broadcom. Nothing in datapath/ applies
# to it: there is no CMIC, no BDE, no openbcm SDK, and no SDK of any kind that
# may be linked -- libFocalpointSDK.so is proprietary and stays out of this
# repository. The datapath for this chip is register-level code we write.
#
# STATUS: planned. Nothing here has been built or booted. What is recorded below
# was read off the running unit (EOS 4.16.8M, hostname sw7150-lab) during the
# reverse engineering that precedes this port, and is transcribed rather than
# re-derived -- see docs/hardware.md for what is measured and what is assumed.

id: arista-7150s-52
vendor: arista
model: 7150s-52

arch: x86_64
asic: fm6000
boot: aboot

# Read off this chassis's own prefdl on 2026-09-22: HwEpoch 01.00.
aboot_max_hwepoch: "1"

# Console. 9600 is what Aboot and EOS use here (CONSOLESPEED=9600 console=ttyS0
# on the live kernel command line), and a getty at any other speed makes
# everything after it unreadable.
console: ttyS0
console_baud: 9600

# minimal, matching the sibling Arista board: s6 rather than systemd. Not yet
# built for this board, so this is the intent and not a measurement.
profile: minimal
kernel: ""

# Flash layout. /dev/sda1 is 1.5 GB with 511 MB free as of 2026-09-22, after
# twenty-five old EdgeNOS builds came off it. EOS-4.16.8M.swi is 416 MB of what
# remains and stays: it is the only way back and the last EOS that supports this
# platform.
#
# The sibling 7050SX2 gives each A/B slot 768 MiB, which does not fit here even
# once. These were left unset until an image had been built for this board and
# measured, because choosing them from an estimate is how the sibling ended up
# declaring a profile it was not running.
#
# Measured 2026-09-25, minimal x86_64, from out/images/arista-7150s-52:
#
#     vmlinuz              13.6 MiB
#     rootfs.sqsh          43.4 MiB   <- what a slot actually costs
#     initramfs.cpio.gz    44.5 MiB   (RAM-boot only; not installed)
#     the RAM-boot SWI     58.2 MiB
#
# So a slot's content is 57 MiB today. 128 MiB gives it room to roughly double
# before anyone has to think about this again, and the whole layout still fits:
#
#     boot 64  +  slot 128 x2  +  data 128  =  448 MiB, against 511 MiB free
#
# ⚠ Like the sibling, this board boots through Aboot from a filesystem rather
# than from partitions, so these are not partition sizes here and nothing
# currently reads them -- a slot costs exactly its squashfs. They are stated so
# that the numbers are measured ones if the partitioned layout is ever used,
# and so the defaults (slot 96 MiB) cannot silently apply: 96 would leave this
# board 39 MiB of headroom on a 57 MiB image.
#
# There is about another 530 MB reclaimable from reverse-engineering traces if
# a bigger layout is ever wanted. EOS-4.16.8M.swi is 416 MB of the rest and
# stays: it is the only way back and the last EOS that supports this platform.
boot_mib: 64
slot_mib: 128
data_mib: 128

# Deliberately not stated yet:
#
#   kernel_params  EOS passes dmamem=48M on this platform and the box has no
#                  IOMMU (BIOS-disabled, zero iommu_groups), so the FM6000's
#                  packet DMA needs a reserved region the same way the Broadcom
#                  boards do. The address that region can live at depends on
#                  where this board's ~3978 MB of RAM ends, and guessing it
#                  produces a kernel that dies before the console is up.
#
#   thermal        No sensor has been read by our code on this box.

# The board's own hardware is behind Arista's SCD, an FPGA on the PCI bus. It
# holds the FM6000 in reset from power-on, which is why the ASIC's address is
# stated: until the SCD lets go, 02:00.0 is not on the bus to be discovered.
#
# Only the three axes that are measured are stated. Deliberately absent:
#
#   smbus:   the sensor and cage layout. Not known for this board, and the
#            sibling boards' is not transferable -- theirs was transcribed from
#            what was already running, and nothing is running here yet.
#
# ⚠ The reset-bit polarity here is the OPPOSITE of the sibling 7050SX2.
# Unimplemented bits read as ZERO on this board: cold, 0x4000 reads 0x00000106,
# so bits 1, 2 and 8 are the ones held. That board reads 0xfffffffc with its
# ASIC running, and its driver warns that taking another platform's bit number
# would be silently fatal. The warning applies here in reverse.
#
# What this unlocks today is the SMBus: the Alta's voltage controller and its
# sequencer are behind the SCD's accelerators, at /scd/1/1/0x70 (CHL8228G) and
# /scd/0/1/0x4e (UCD90160), and `nosaic platform smbus read` can reach them
# once the board declares it has an SCD at all.
platform_hal:
  driver: scd
  pci: "0000:04:00.0"
  asic_pci: "0000:02:00.0"

  # The bits in the SCD's reset block that hold the switch chip, released in
  # this order. Read out of the vendor's own register description, where the
  # fields are named: alta = 1, sol = 2, rpt = 8. A cold 0x4000 reads 0x106,
  # which is exactly those three.
  #
  # ⚠ STATED BECAUSE THE DRIVER'S DEFAULT IS THE SIBLING BOARD'S AND IS WRONG
  # HERE. That default is bits 0 and 1, from the 7050SX2. On this board bit 0
  # does not exist and bits 2 and 8 do, so the default writes a bit that goes
  # nowhere and never touches two lines that matter -- silently, because an
  # unimplemented bit accepts the write and reports success. The sibling's own
  # comment warns about exactly this and then hard-codes its numbers for
  # everyone.
  switch_reset_bits: [1, 2, 8]

  # ⚠ THE FM6000 NEEDS THE RESET EDGE, NOT MERELY TO BE FOUND RELEASED.
  # Measured 2026-09-25: with these bits clear from boot, every register reads
  # 0 -- including PIN_STRAP, which is a hardware strap and cannot be 0 on a
  # live part. Drive them and let go and it reads 0x208 within a second, every
  # time. Without this the release is a no-op and the chip is silent, which
  # looks exactly like a chip that was never there.
  # See docs/hardware.md, "It takes a reset PULSE, not a release".
  switch_reset_always_pulse: true

  # ⚠ THE CHIP IS NOT ON THE PCI BUS WHEN ITS RESET IS RELEASED, AND THAT IS
  # CORRECT. The FM6000's PCIe block is brought up as part of chip
  # initialisation; until then the host reaches its registers through the SCD's
  # BAR1 local-bus window. Waiting for the endpoint here times out after a
  # perfectly successful release and reports a working board as broken, which
  # is what `release-asic` did until 2026-09-25.
  switch_pcie_after_config: true

  # The board identity EEPROM, carrying model, serial, hardware revision and
  # the base MAC.
  #
  # ⚠ NOT ON THE SCD. Everything else here is behind the SCD's SMBus
  # accelerators; this is address 0x52 on **host** i2c bus 1 -- the PIIX4
  # southbridge bus that also carries the board CPLD at 0x23. Sweeping the
  # SCD's accelerators for it found the 52 cages and the two PSU FRU EEPROMs
  # and never could have found this.
  #
  # Located 2026-09-26 by loop-mounting the EOS image off our own flash and
  # reading `GenprefdlPlugin/Raven.py`, which names `idseeprom --device=1.0x52`.
  # Confirmed by the MAC matching the one this board's config has been
  # asserting by hand.
  prefdl: {bus: 1, addr: 0x52}

  # The board's SMBus, recovered by scanning it 2026-09-25 with NOSaic's own
  # scdsmbus -- accelerators 0..9 exist, 10 and up answer "no response".
  #
  # ⚠ ONE SENSOR, AND NO FANS YET. A scan of 0x58..0x68 on accelerators 0 and 1
  # found no fan controller, so none is declared and no cooling loop starts.
  # The fans are somewhere -- the chassis has them -- and until they are found
  # this board reports temperature through `nosaic platform status` and
  # regulates nothing. Declaring a controller we have not read would be worse
  # than declaring none.
  smbus:
    sensors:
      # Local and remote diodes of one LM90-compatible part at accel 0 bus 0.
      # Read 0x1c (28 °C) and 0x19 (25 °C) on a warm board.
      #
      # The part is named for its register layout, not a part number: it
      # answers manufacturer ID (0xfe) 0x01 and device ID (0xff) 0x11, which is
      # not Maxim and so not the max6658 whose two registers are identical.
      #
      # ⚠ What the REMOTE diode is wired to is not established. It reads
      # *cooler* than the local one, which argues against it being the FM6000
      # die, so it is named for what it is rather than for a guess.
      - {name: board,  part: lm90,        accel: 0, bus: 0, addr: 0x4c}
      - {name: remote, part: lm90-remote, accel: 0, bus: 0, addr: 0x4c}

  # The 52 front-panel SFP+ cages.
  #
  # Triangulated three ways on 2026-09-25 rather than taken from a table:
  #
  #   1. scanning 0x50 across accelerators 0..9 and buses 0..7 found exactly
  #      two SFF-8472 identifiers (0x03), at accel 2 bus 0 and accel 2 bus 1;
  #   2. the SCD's own per-cage registers read 0x1E0 at 0x5010 and 0x5020 and
  #      0x1DF at the other fifty -- the same two cages and no others;
  #   3. those two are Ethernet1 and Ethernet2, the only ports EOS has up.
  #
  # So panel port N is SCD 0x5010 + (N-1)*0x10, and SMBus accelerator
  # 2 + (N-1)/8 bus (N-1)%8. Accelerators 2..8 give 56 buses for 52 cages.
  #
  # No QSFP on this board: 52 SFP+ and nothing else.
  cages:
    base: 0x5010
    stride: 0x10
    count: 52
    sfp_count: 52
    sfp_eeprom: {accel_base: 2, buses_per_accel: 8}

status: planned

notes: >
  The FM6000 is held in reset by the SCD from power-on and does not enumerate on
  a bare kernel. Until the SCD is told to release it, 02:00.0 is not on the bus
  to be found -- a kernel that sees no ASIC here is the expected state, not a
  fault.

  The chip is 8086:155b (Fulcrum 1823:1770) behind the RS780's PCIe port 0, with
  its own BAR0; the packet DMA block is at BAR0 byte offset 0x5000. The SCD is
  a separate endpoint at 04:00.0, BAR0 at 0xe1000000, 256 KiB, word-addressed.

  This board reboots badly. EOS does not use the hardware reset at all -- it
  kexecs, and its halt script says so in as many words. Every hardware reset
  path tried from a bare kernel on this box hangs. Plan on the power controller
  for recovery and treat a working software reboot as an open question rather
  than a given.

  The management NIC is a BCM5785 southbridge function (14e4:1699, tg3) behind
  a BCM50610 PHY on RGMII. Arista's own boot0 carries a bug note that ma1 loses
  its MAC mailbox across a kexec from EOS, so a MAC read after one is not the
  board's. The real one is in prefdl, and on this chassis it reads
  MacAddrBase 44:4c:a8:31:5d:aa.

  prefdl also carries FdlVariables {'AltaVdd':1.01,'AltaVdds':1.0} -- the
  ASIC's core supply voltages, which are per-board data and not a constant.
  Whatever sets the Alta rails has to read them from here rather than assume.

  The front panel is 52 SFP+ cages, all 10G, numbered 1..52. There are no
  QSFP cages and no external PHYs to load firmware into: every port is direct
  serdes off the FM6000.
