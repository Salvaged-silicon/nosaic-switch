# ASIC configuration for the Dell Networking S6000-ON (BCM56850, Trident II).
#
# Global (non-port-keyed) Broadcom SDK properties for this model plus the
# front-panel tap declarations. Per-port lane maps, polarity flips, and SerDes
# equalization live in config/portmap.conf (generated by tools/mkportmap.sh).

# Poll for interrupts rather than taking an IRQ line through the SDK.
polled_irq_mode=1
miim_intr_enable=0
schan_intr_enable=0

# Port bitmaps (from Dell S6000-ON config.bcm): logical ports 1..98 covered
# so both 40G cages (1..32) and 4x10G breakout logical ports (33+) are enabled.
pbmp_xport_xe=0x000007fffffffffffffffffffffffffe
pbmp_oversubscribe=0x000007fffffffffffffffffffffffffe
module_64ports=0

# Forwarding table sizing & LPM.
l2_mem_entries=32768
l3_mem_entries=16384
l3_alpm_enable=2
ipv6_lpm_128b_enable=1
l3_alpm_hit_skip=1
max_vp_lags=0
mmu_lossless=0

# Switching, stats, and timeouts.
os=unix
l2xmsg_mode=1
l2xmsg_hostbuf_size=8192
bcm_num_cos=10
bcm_stat_interval=2000000
bcm_stat_jumbo=9236
higig2_hdr_mode=1
parity_correction=1
parity_enable=1
stat_if_parity_enable=0
stable_size=0x2000000
tdma_timeout_usec=5000000

# Front-panel 32x 40GbE QSFP+ cages exposed to Linux as swp1..swp32.
tap_swp1=1:1001:1500
tap_swp2=2:1002:1500
tap_swp3=3:1003:1500
tap_swp4=4:1004:1500
tap_swp5=5:1005:1500
tap_swp6=6:1006:1500
tap_swp7=7:1007:1500
tap_swp8=8:1008:1500
tap_swp9=9:1009:1500
tap_swp10=10:1010:1500
tap_swp11=11:1011:1500
tap_swp12=12:1012:1500
tap_swp13=13:1013:1500
tap_swp14=14:1014:1500
tap_swp15=15:1015:1500
tap_swp16=16:1016:1500
tap_swp17=17:1017:1500
tap_swp18=18:1018:1500
tap_swp19=19:1019:1500
tap_swp20=20:1020:1500
tap_swp21=21:1021:1500
tap_swp22=22:1022:1500
tap_swp23=23:1023:1500
tap_swp24=24:1024:1500
tap_swp25=25:1025:1500
tap_swp26=26:1026:1500
