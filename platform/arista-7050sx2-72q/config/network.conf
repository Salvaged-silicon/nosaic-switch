# Network configuration for this board, copied from the EdgeNOS installation
# it replaces so the two can be compared directly.
#
# Captured from the running switch on 2026-08-28. et1 and et2 are front-panel
# ports and exist only once the datapath is up; a management-plane boot brings
# up eth0 and says plainly that the others are absent, rather than failing.
#
#   iface <name> <address/prefix> [mtu <n>]
#   route <prefix|default> via <gateway> [dev <iface>]

# Management. The BCM57762 the kernel drives with tg3 -- a normal NIC, present
# whether or not the ASIC is.
# The MAC is stated here because this board does not keep it anywhere tg3 can
# find it -- it lives in board data on an i2c SEEPROM, which nothing in NOSaic
# reads yet. Read off the switch from Aboot's own ifconfig on ma1.
#
# This is a stopgap and should disappear: once the prefdl reader exists, the
# board supplies its own address and no configuration file should be asserting
# hardware identity.
iface eth0 10.1.1.241/24 mac 44:4c:a8:eb:93:f6
route default via 10.1.1.1

# The loopback carries the OSPF router-id. It is a loopback precisely so the
# id does not move when a front-panel port goes down.
iface lo 10.101.255.53/32

# Front panel. MTU 1600 because the OSPF neighbour uses it, and et2 carries
# "ip ospf mtu-ignore" on the EdgeNOS side for the same reason.
iface et1 10.101.101.42/29 mtu 1600
iface et2 10.101.101.57/29 mtu 1600

# The OSPF neighbour lives at 10.101.101.58 on et2 and advertises about
# seventeen prefixes. Nothing here speaks OSPF yet: FRR is not packaged, so
# these addresses are configured and the adjacency is not formed.

# The two 40G cages. Each /29 follows the same one-subnet-per-link pattern
# as the 10G links above; .64/29 and .72/29 were the next free blocks.
#
#   et54  <->  AS5610 swp51        (10.101.101.66 on the far side)
#   et53  <->  7050TX-64 port 50   (far side not yet configured)
#
# Configured here and NOT yet carrying traffic. Both cages link at 40G and
# stay up, both far ends agree, and neither has passed a frame: the port's
# MAC counts nothing in either direction while its PCS reports link. That
# is an open fault, written up in docs/todo.md. These lines are here
# because the addressing is settled and correct; when the datapath fault is
# fixed the links come up with no further configuration.
iface et53 10.101.101.73/29 mtu 1600
iface et54 10.101.101.65/29 mtu 1600

# Keep management traffic on the management port.
#
# This switch runs OSPF on its front-panel ports, so it LEARNS a route to the
# build network over them -- and a learned /24 beats the default route by
# longest-prefix match. The result is that the box's own management traffic
# leaves by the front panel and comes back through the CPU punt path, which
# carries about twenty packets a second. Pulling an image ran at 21 KB/s and
# saturated the box; with this line it runs at over 2 MB/s and does not.
#
# Nothing was misconfigured to cause that. It is what happens when a router
# with a management port also participates in the routing domain that contains
# its management station: in-band and out-of-band are the same table, and the
# more specific route wins regardless of which one you meant.
#
# A static route has metric 0 and OSPF's has 20, so this wins at equal prefix
# length. The real answer is a management VRF, which is in docs/todo.md.
route 10.22.1.0/24 via 10.1.1.1 dev eth0
