# ASIC configuration for the Arista DCS-7050SX2-72Q-R (BCM56860, Trident2+).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time
# through config_var_get.
#
# THE PORT MAP IS NOT HERE, AND MUST NOT BE.
#
# The SDK cannot bring up a port without knowing which logical port is wired to
# which physical SerDes lane. That is a fact about this board, and no public
# document publishes it: this is a 2017-era EOS-only machine, absent from
# Arista's open SONiC platform tree and from sonic-buildimage.
#
# It has to be read from the vendor's software on the switch that has it, which
# makes it vendor-derived. NOSaic ships the generator and not its output:
#
#     tools/mkportmap.sh <switch-ip> > portmap.conf
#     tools/mkportmap.sh --stdin < captured.txt > portmap.conf
#
# and nosd-td2p loads portmap.conf alongside this file.
#
# GUESSING DOES NOT WORK, and it fails in a way that looks like working. A
# sequential map satisfies every bandwidth rule the chip enforces and reaches
# none of the right cages. Read off this board:
#
#     Ethernet1..20    physical lanes 13..32
#     Ethernet21..48   physical lanes 41..68
#     Ethernet49/1..4  physical lanes 73..76
#     Ethernet50/1..4  physical lanes 69..72     <- below Ethernet49
#
# The QSFP cages are not in physical order. An earlier version of this file
# carried a sequential map described as provisional. It was wrong for every
# port on the board, and the chip accepted it without complaint.

# Poll for interrupts rather than taking an IRQ line.
#
# NOSaic's BDE has no interrupt to connect: it reaches the chip by mapping the
# PCI BAR from userspace, which is how the vendor OS reaches it too, and there
# is no kernel driver bound to route a vector to us. Without this the SDK takes
# the IRQ path during attach and stops at
#
#   soc_attach: could not connect interrupt line
#
# The SDK's own poller is the supported alternative (src/soc/esw/drv.c:21160),
# so this is choosing a path it offers rather than working around it. Interrupt
# delivery is a later question and a separable one -- and worth being a
# deliberate step, because an interrupt path is one more thing that can be
# wrong while the question is still whether the chip comes up at all.
polled_irq_mode=1

# Everything else that can wait on an interrupt must poll too.
#
# polled_irq_mode only redirects the SDK's interrupt handler thread. Several
# data paths separately choose between waiting on an interrupt and polling, and
# each defaults to the interrupt. With no interrupt delivery, each one hangs
# until its timeout and then fails the operation -- during bcm_attach that
# looks like
#
#   _soc_mem_sbusdma_write: 256 entries ... Interrupt-Mode(1)
#   SOURCE_TRUNK_MAP_MODBASE.ipipe0 interrupt timeout
#   Fatal error: CMC 0 channel 1 abort failed, cold boot might be needed
#
# which reads as a broken DMA engine rather than a missing interrupt. These are
# the four paths that offer the choice.
tdma_intr_enable=0      # table DMA -- the one that fails above
tslam_intr_enable=0     # table SLAM DMA
schan_intr_enable=0     # S-Channel
miim_intr_enable=0      # MDIO
