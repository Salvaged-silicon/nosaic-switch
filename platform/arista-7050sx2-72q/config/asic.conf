# ASIC configuration for the Arista DCS-7050SX2-72Q-R (BCM56860, Trident2+).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time
# through config_var_get. Port map format, from the SDK's own parser at
# src/soc/esw/trident2.c:7949:
#
#   portmap_<logical>=<physical port>:<bandwidth in Gb>
#
# WHY THE PHYSICAL PORTS ARE NOT CONSECUTIVE
#
# The chip is four quads of 32 physical ports, and each quad has a line-rate
# budget of 240 Gb (its share of the device bandwidth, computed by the SDK as
# total/4). Numbering the 72 lanes 1..72 puts 320 Gb in each of the first two
# quads and nothing in the other two, which the SDK rejects:
#
#   PGW_CL0 and PGW_CL1 total line rate bandwidth (320 Gb) exceeds 240 Gb
#
# Ports are grouped in fours: 4 lanes per XLP, 4 XLPs per PGW, 2 PGWs per
# quad. Each XLP used here carries 40 Gb whether it is four 10G SFP+ lanes or
# one 40G QSFP cage, so the 18 XLPs needed are dealt round-robin across the
# four quads -- 5, 5, 4, 4 -- giving 200, 200, 160, 160 Gb and leaving every
# quad inside its budget.
#
# ⚠️  THE FRONT-PANEL CORRESPONDENCE IS STILL PROVISIONAL.
#
# This satisfies the chip's constraints. It does NOT establish which physical
# lane reaches which cage on the front panel: that is a fact about how this
# board is wired, and NOSaic has not measured it. The obvious source is not
# usable -- the map in the reverse-engineering repository was parsed out of
# EOS and is marked non-publishable there, so it has to be derived rather
# than copied.
#
# The board notes record the shape of the trap: for the 48 SFP+ cages the
# SDK's physical port index IS the RX lane, and for the 24 QSFP lanes it is
# NOT -- there it follows the cage's subport. Code assuming one rule for both
# mis-maps two thirds of the QSFP capacity, and it presents as a dead port
# rather than as a wrong index.
#
# Validate per port against real link-up before trusting any of it.

# Poll for interrupts rather than taking an IRQ line.
#
# NOSaic's BDE has no interrupt to connect: it reaches the chip by mapping the
# PCI BAR from userspace, which is how the vendor OS reaches it too, and there
# is no kernel driver bound to route a vector to us. Without this the SDK takes
# the IRQ path during attach and stops at
#
#   soc_attach: could not connect interrupt line
#
# The SDK's own poller is the supported alternative (src/soc/esw/drv.c:21160),
# so this is choosing a path it offers rather than working around it. Interrupt
# delivery is a later question and a separable one -- and worth being a
# deliberate step, because an interrupt path is one more thing that can be
# wrong while the question is still whether the chip comes up at all.
polled_irq_mode=1

# Everything else that can wait on an interrupt must poll too.
#
# polled_irq_mode only redirects the SDK's interrupt handler thread. Several
# data paths separately choose between waiting on an interrupt and polling, and
# each defaults to the interrupt. With no interrupt delivery, each one hangs
# until its timeout and then fails the operation -- during bcm_attach that
# looks like
#
#   _soc_mem_sbusdma_write: 256 entries ... Interrupt-Mode(1)
#   SOURCE_TRUNK_MAP_MODBASE.ipipe0 interrupt timeout
#   Fatal error: CMC 0 channel 1 abort failed, cold boot might be needed
#
# which reads as a broken DMA engine rather than a missing interrupt. These are
# the four paths that offer the choice.
tdma_intr_enable=0      # table DMA -- the one that fails above
tslam_intr_enable=0     # table SLAM DMA
schan_intr_enable=0     # S-Channel
miim_intr_enable=0      # MDIO


