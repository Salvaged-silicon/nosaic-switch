# ASIC configuration for the Arista DCS-7050SX2-72Q-R (BCM56860, Trident2+).
#
# Broadcom's config.bcm content, answered to the SDK one property at a time
# through config_var_get.
#
# THE PORT MAP IS NOT HERE, AND MUST NOT BE.
#
# The SDK cannot bring up a port without knowing which logical port is wired to
# which physical SerDes lane. That is a fact about this board, and no public
# document publishes it: this is a 2017-era EOS-only machine, absent from
# Arista's open SONiC platform tree and from sonic-buildimage.
#
# It has to be read from the vendor's software on the switch that has it, which
# makes it vendor-derived. NOSaic ships the generator and not its output:
#
#     tools/mkportmap.sh <switch-ip> > portmap.conf
#     tools/mkportmap.sh --stdin < captured.txt > portmap.conf
#
# and nosd-td2p loads portmap.conf alongside this file.
#
# GUESSING DOES NOT WORK, and it fails in a way that looks like working. A
# sequential map satisfies every bandwidth rule the chip enforces and reaches
# none of the right cages. Read off this board:
#
#     Ethernet1..20    physical lanes 13..32
#     Ethernet21..48   physical lanes 41..68
#     Ethernet49/1..4  physical lanes 73..76
#     Ethernet50/1..4  physical lanes 69..72     <- below Ethernet49
#
# The QSFP cages are not in physical order. An earlier version of this file
# carried a sequential map described as provisional. It was wrong for every
# port on the board, and the chip accepted it without complaint.

# Poll for interrupts rather than taking an IRQ line.
#
# NOSaic's BDE has no interrupt to connect: it reaches the chip by mapping the
# PCI BAR from userspace, which is how the vendor OS reaches it too, and there
# is no kernel driver bound to route a vector to us. Without this the SDK takes
# the IRQ path during attach and stops at
#
#   soc_attach: could not connect interrupt line
#
# The SDK's own poller is the supported alternative (src/soc/esw/drv.c:21160),
# so this is choosing a path it offers rather than working around it. Interrupt
# delivery is a later question and a separable one -- and worth being a
# deliberate step, because an interrupt path is one more thing that can be
# wrong while the question is still whether the chip comes up at all.
polled_irq_mode=1

# Everything else that can wait on an interrupt must poll too.
#
# polled_irq_mode only redirects the SDK's interrupt handler thread. Several
# data paths separately choose between waiting on an interrupt and polling, and
# each defaults to the interrupt. With no interrupt delivery, each one hangs
# until its timeout and then fails the operation -- during bcm_attach that
# looks like
#
#   _soc_mem_sbusdma_write: 256 entries ... Interrupt-Mode(1)
#   SOURCE_TRUNK_MAP_MODBASE.ipipe0 interrupt timeout
#   Fatal error: CMC 0 channel 1 abort failed, cold boot might be needed
#
# which reads as a broken DMA engine rather than a missing interrupt. These are
# the four paths that offer the choice.
tdma_intr_enable=0      # table DMA -- the one that fails above
tslam_intr_enable=0     # table SLAM DMA
schan_intr_enable=0     # S-Channel
miim_intr_enable=0      # MDIO

# Fixed optical links: nothing to negotiate with.
#
# Leaving autoneg on makes the SDK negotiate against a partner that never
# answers.
port_init_autoneg=0
port_init_duplex=1

# The un-suffixed form applies to every port, and 10G is right for the 48 SFP+
# cages. It is NOT right for a QSFP cage running as one 40G port, and it is not
# harmless there: portctrl.c resolves
#
#     speed = port_init_speed[port] > 0 ? port_init_speed[port]
#                                       : port_speed_max[port]
#
# so this pins a 40G cage to 10G and the link never comes up. Leaving it unset
# is not the answer either -- a TD2+ XLPORT macro reports port_speed_max 40000,
# which resolves a 40GBASE-KR4-class interface, and KR4 means clause-72 link
# training on cages that hold optics.
#
# So: 10G globally, and the 40G cages named individually. These are logical
# port numbers, indexed the same way portmap_<n> and pbmp_xport_xe are.
port_init_speed=10000

# The 40G cages, keyed BY PORT NAME.
#
# This is the form the SDK actually reads. soc_property_port_get tries
# <name>_<port name> and falls back to the bare <name>; the logical-number form
# is not reliably in that chain, so port_init_speed_65=40000 was loaded,
# reported as configuration, and did nothing -- the port stayed at the global
# 10000 while the map said 40G.
#
# Proven by leaving one cage without an override: with xe52 and xe53 set, ports
# 65 and 69 came up at 40000 and port 61, which has none, stayed at 10000.
#
# xeN is the port's position in pbmp_xport_xe, so these move if the port count
# changes. Under the 54-port map the six cages are xe48..xe53:
#   xe48 -> 49   xe49 -> 53   xe50 -> 57   xe51 -> 61   xe52 -> 65   xe53 -> 69
port_init_speed_xe48=40000
port_init_speed_xe49=40000
port_init_speed_xe50=40000
port_init_speed_xe51=40000
port_init_speed_xe52=40000
port_init_speed_xe53=40000

# --- SerDes TX lane map ---
#
# 0x0123 is 0x3210 pre-complemented. Established by measurement on this board
# by EdgeNOS: with it set, Et1 transmits losslessly from a cold init -- chip TX
# 169, far end 170. Removing it puts the port back to chip TX 170, far end 0,
# which is transmitting into nothing.

# Per-macro exceptions: these blocks want the SDK's 0x3210 default instead.
#
# ⚠ The values are ours; the PORT LIST is specific to this board model. It was
# determined by comparing the resulting 0xd0fb against the vendor software's.
# On a different board, or if links come up carrying garbage on some ports and
# not others, re-derive it by reading the TX lane map registers 0xd0fb/0xd0fc
# per macro and finding the property that reproduces them. Do not assume it
# transfers.

# QSFP blocks 42 and 45 are deliberately absent. Two derived values were tried
# and both refuted against the reference 0xd0fb, so the parity is not
# understood per macro. Guessing brings a link up carrying garbage, which is
# worse than leaving it at the global value until it is measured.
#
# All of the above is from EdgeNOS's platform/arista-7050sx2-72q, which
# established it on this hardware first.

# Which ports appear on the Linux network stack, and as what.
#
#     tap_<interface name>=<logical port>
#
# The datapath creates a tap device per entry and bridges it to that hardware
# port, so a routing daemon can be configured against the name and never has to
# know a switch chip is involved.
#
# Only the two ports this switch has cables in. Bridging all 72 would create 72
# interfaces the kernel has to poll for nothing.
#
# ⚠️  Two ports is a minimum for proving forwarding, not a coincidence. With one
# routed port the only test path is back out the interface the packet arrived
# on, and Trident2+ drops that by design -- so a single port cannot distinguish
# "forwarding works" from "forwarding is broken".
# <logical port>:<vlan>:<mtu>. The VLAN is dedicated per routed port and egresses
# untagged -- without it the chip tags what it sends and a routed neighbour
# counts the frames as received AND dropped, which looks like nothing arriving.
tap_et1=1:1006:1600
tap_et2=2:1007:1600

# The 40G cages. The name is the front-panel cage; the number after it is the
# SDK's logical port, and those are not the same above cage 48 -- Ethernet53 is
# logical 65 and Ethernet54 is logical 69, because a QSFP cage occupies four
# consecutive logical ports even when it is running as one 40G port.
#
# Only the cages that are cabled get a tap. A tap on a dark cage costs a VLAN,
# a router interface and a MY_STATION entry to present an interface nothing can
# reach.
tap_et53=65:1053:1600
tap_et54=69:1054:1600

# --- SerDes lane maps, per port, from EOS's own live SDK config ---
#
# tsce.c:995 reads these with soc_property_port_suffix_num_get(unit, port,
# core_num, spn_XGXS_TX_LANE_MAP, "core", 0x3210) -- hence the _core0_
# form, and note the SDK's own default is 0x3210 rather than the 0x0123
# this board's global was set to.
#
# Emitted per port rather than as a global plus exceptions, because EOS
# uses at least six distinct values across the front panel and a global
# is wrong for most of them. Ethernet53 and Ethernet54 -- logical 65 and
# 69, the cabled 40G cages -- differ from each other.

xgxs_tx_lane_map_core0_1=0x0123
xgxs_rx_lane_map_core0_1=0x3210
xgxs_tx_lane_map_core0_5=0x0123
xgxs_rx_lane_map_core0_5=0x3210
xgxs_tx_lane_map_core0_9=0x0123
xgxs_rx_lane_map_core0_9=0x3210
xgxs_tx_lane_map_core0_13=0x0123
xgxs_rx_lane_map_core0_13=0x3210
xgxs_tx_lane_map_core0_17=0x0123
xgxs_rx_lane_map_core0_17=0x3210
xgxs_tx_lane_map_core0_21=0x0123
xgxs_rx_lane_map_core0_21=0x3210
xgxs_tx_lane_map_core0_25=0x0123
xgxs_rx_lane_map_core0_25=0x3210
xgxs_tx_lane_map_core0_29=0x0123
xgxs_rx_lane_map_core0_29=0x3210
xgxs_tx_lane_map_core0_33=0x0123
xgxs_rx_lane_map_core0_33=0x3210
xgxs_tx_lane_map_core0_37=0x0123
xgxs_rx_lane_map_core0_37=0x3210
xgxs_tx_lane_map_core0_41=0x0123
xgxs_rx_lane_map_core0_41=0x3210
xgxs_tx_lane_map_core0_45=0x0123
xgxs_rx_lane_map_core0_45=0x3210
xgxs_tx_lane_map_core0_49=0x0123
xgxs_rx_lane_map_core0_49=0x1032
xgxs_tx_lane_map_core0_53=0x0123
xgxs_rx_lane_map_core0_53=0x1032
xgxs_tx_lane_map_core0_57=0x2031
xgxs_rx_lane_map_core0_57=0x1302
xgxs_tx_lane_map_core0_61=0x2031
xgxs_rx_lane_map_core0_61=0x1302
xgxs_tx_lane_map_core0_65=0x3210
