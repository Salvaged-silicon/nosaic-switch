# Arista DCS-7050SX2-72Q-R — Trident2+ (BCM56860).
#
# NOSaic's first real board. As of 2026-09-04 it is installed to its own flash
# and has survived a cold power cycle: it boots standalone from Aboot into
# file-backed A/B slots, forwards in hardware, holds four OSPF adjacencies and
# reads real sensors -- all from the installed image rather than a hot patch.
#
# A full A/B upgrade has now run on this board: an image installed into slot B,
# booted on trial as attempt 1 of 3, was committed, and the next boot came up
# on B as the committed slot with no trial pending.
#
# experimental rather than production because the one case that matters most is
# still unproven HERE: an image that boots but does not forward must roll back
# unattended. That is M7's gate. It passes in QEMU and the initramfs handles a
# missing or corrupt slot correctly on this board, but a bad-but-booting image
# has never been tried on this hardware. See docs/architecture.md.

id: arista-7050sx2-72q
vendor: arista
model: 7050sx2-72q

arch: x86_64
asic: td2p
boot: aboot

# The board's prefdl reports HwEpoch 1, so a SWI claiming 1 is accepted. EOS
# 4.20 on the same family ships SWI_MAX_HWEPOCH=2; 4.14 has no such field.
aboot_max_hwepoch: "1"

# The console. 9600 is what this box runs and what Aboot uses; a getty at any
# other speed reconfigures the port and everything after it is unreadable.
console: ttyS0
console_baud: 9600

# systemd, because this box has flash to spare and no reason to run the tier
# built for boards that do not.
# minimal, which is what this board actually runs and boots.
#
# This said `full` while every working image installed on it was minimal, and
# the two are not interchangeable: full is systemd and minimal is s6. Building
# the declared default and installing it produced a box that reached "Started
# ospf6d" and then never came up -- no management, no datapath, no console
# prompt -- and took an OSPF adjacency down with it. Recovered by catching Aboot
# and booting the previous SWI explicitly.
#
# Board data that describes something other than the board is worse than absent:
# it is the input to the image someone installs, and the failure lands on
# hardware rather than in the build.
profile: minimal
kernel: ""

# Flash layout. This board has around 2.1 GB free and the vendor's own OS
# occupies 347 MB (EOS 4.14) to 600 MB (4.20), so the defaults chosen for a
# virtual machine -- 96 MiB slots -- are far too small to be meaningful here.
# A datapath daemon linked against the Broadcom SDK is 151 MB stripped on its
# own.
# boot_mib and slot_mib are unused here and kept for the partitioned layout the
# other boards use: this eMMC is fully allocated to Aboot's FAT, so the slots
# are files on it and a slot costs exactly its squashfs. data_mib is the size
# of the ext4 image that FAT carries.
boot_mib: 64
slot_mib: 768
data_mib: 512

# The kernel command line, appended to the console and panic settings.
#
# Read off the running switch rather than assumed, and two of these were wrong
# when assumed. memmap reserves the DMA pool the userspace BDE claims through
# /dev/mem; it sits at 0xd0000000 because this board has 3844 MB of RAM and the
# 0x100000000 that a 4 GB-plus machine would use is past the end of memory
# here. iomem=relaxed is what allows /dev/mem to map that region at all --
# without it the mapping fails and nothing says why.
# earlyprintk so a kernel that dies before the console is up still says so --
# on a box reached by serial that is the difference between a diagnosis and a
# silent brick.
#
# reboot=p because EOS uses it on this board. The 7150's boot0 adds
# reboot=p,force for AP cores that wedge post-kexec; this box reboots cleanly
# and does not need it.
#
# nosmp was carried over from the 7150 as a conservative default and is now
# dropped. It was a workaround for AP cores that wedge post-kexec on that box;
# this one reboots cleanly, and it costs three of the four cores. The first
# boot here hung shortly after systemd started, and the likelier cause is the
# management interface being left up across the kexec -- which boot0 now
# handles the way the vendor's does.
#
# memmap reserves the pool the userspace BDE claims through /dev/mem, and
# iomem=relaxed is what permits that mapping at all. 0xd0000000 rather than
# 0x100000000: this board has 3844 MB, so 4 GB is past the end of memory.
#
# Not yet included: EOS passes dmamem=136M on this platform (platform=magpie;
# PortolaSPlus is not in the 272M SID list). Irrelevant while the ASIC is dark,
# required once the datapath does DMA.
kernel_params: "earlyprintk=serial,ttyS0,9600 rdinit=/init panic=10 reboot=p memmap=64M$0xd0000000 iomem=relaxed"

# The board's own hardware -- reset lines, watchdog, sensors -- is behind
# Arista's SCD, an FPGA on the PCI bus. It holds the Trident2+ in reset from
# power-on, which is why the ASIC's address is stated here: until the SCD is
# told to let go, 01:00.0 is not on the bus to be discovered.
platform_hal:
  driver: scd
  pci: "0000:05:00.0"
  asic_pci: "0000:01:00.0"

# The cooling curve. Established on this board by EdgeNOS: at or below 35 °C
# the fans sit at the controller's floor, at or above 65 °C they are flat out.
#
# Falling duty is limited because reacting instantly downward makes the fans
# oscillate around a threshold; rising is immediate because the opposite
# asymmetry is a thermal risk.
thermal:
  min_c: 35
  max_c: 65
  slew_down_percent: 5
  interval_seconds: 10

status: experimental

notes: >
  Aboot boots unsigned SWIs here: boot0 is a shell script we control, no
  signing is enforced, and Aboot can load from flash, HTTP, FTP, TFTP or NFS.
  Console is ttyS0 at 9600, and the management port is a BCM57762 (14e4:1682)
  driven by tg3.

  The front panel is 48 SFP+ and 6 QSFP+, 72 ports of 10G. The SDK's physical
  port index IS the RX lane for the 48 SFP+ cages and is NOT for the 24 QSFP
  lanes, where it follows the cage's subport instead. Code assuming one rule
  for both mis-maps two thirds of the QSFP capacity, and it presents as a dead
  port rather than as a wrong index.

  Everything proven on this box so far was proven after kexec from EOS, and
  kexec is known to reset the SerDes here. NOSaic boots standalone from Aboot,
  so the chip is in a different state when our code first touches it. Prove
  standalone boot early, before the datapath work leans on it.

  The datapath does not use Broadcom's BDE kernel modules: they target Linux
  5.10 and older and this fleet runs 6.12. The SDK is driven from userspace
  instead, over an mmap of the ASIC's BAR0, which is how EOS reaches the chip
  on this box too. See kernel_params below for what that needs.

  The management MAC is not in the NIC. It lives in prefdl on an i2c SEEPROM,
  so tg3 aborts its probe on a stock kernel; NOSaic patches it to fall back to
  a random address and applies the real one from config/network.conf. Reading
  prefdl properly is outstanding work and also gates the ASIC core voltage.

  Do not use fanset, and do not trust fanread: it returns garbage on this
  board. Temperature (three sensors), PSU presence and PSU status all read
  correctly. Reaching the fan CPLD at all needs CONFIG_I2C_PIIX4.
